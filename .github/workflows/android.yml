name: android
on:
  push:
    branches: [main]
    paths: ['index.html', 'android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Python tools
        run: pip install --quiet pillow websocket-client
      - name: Prepare Capacitor project
        working-directory: android-app
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee ../ci-npm.log
          mkdir -p www && cp ../index.html ../manifest.webmanifest ../icon-192.png ../icon-512.png ../icon.svg www/
          npx cap add android 2>&1 | tee ../ci-cap.log
          python3 native/apply.py 2>&1 | tee -a ../ci-cap.log
          npx cap sync android 2>&1 | tee -a ../ci-cap.log
      - name: Build APK
        working-directory: android-app/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../ci-gradle.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-app/native/smoke.sh
      - name: Publish test results
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r ci-shots /tmp/out/ 2>/dev/null || true
          for f in ci-npm.log ci-cap.log ci-gradle.log; do [ -f "$f" ] && tail -c 150000 "$f" > /tmp/out/$f; done
          echo "run ${{ github.run_number }} · ${{ github.sha }} · $(date -u)" > /tmp/out/RUN.txt
          cd /tmp/out && git init -q && git checkout -q -b ci-results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci results ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
      - name: Release APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk mohasbak.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest mohasbak.apk --title "محاسبك المالي — أندرويد (نسخة اختبار)" --notes "آخر نسخة أندرويد. نزّل mohasbak.apk وثبّته. التحديثات تُثبَّت فوق السابقة دون حذف بياناتك." --latest
