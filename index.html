<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>محاسبك المالي</title>
<meta name="theme-color" content="#3B43A6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="شريكك المالي: خطة شهرية وتوقع 12–24 شهراً">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&display=swap">
<style>/* محاسبك المالي — نظام التصميم
   التخطيط: جوال أولاً بشريط سفلي وزر إضافة مركزي؛ من 980px شريط جانبي يمين ومحتوى بعرض أقصى 1120px.
   الهوية: حبر نيلي هادئ على رمادي مائل للخضرة، وأرقام بخط Readex Pro كأنها عدّاد كشف حساب. */
:root {
  --bg: #F2F5F4; --surface: #FFFFFF; --surface-2: #E8EEEC; --ink: #13201C; --muted: #5A6A65; --line: #D6DFDB;
  --accent: #3B43A6; --accent-ink: #FFFFFF; --accent-soft: #E3E5F7;
  --good: #1B7F53; --good-soft: #DCF1E6; --calm: #2A6A96; --calm-soft: #DDEBF5;
  --warn: #9A6410; --warn-soft: #FAEED6; --risk: #B83A33; --risk-soft: #F8E0DE;
  --c1: #3B43A6; --c2: #1B7F53; --c3: #C07A12; --c4: #2A6A96; --c5: #8B4BA8; --c6: #B83A33; --c7: #4E7D74; --c8: #7A6C5D;
  --shadow: 0 1px 2px rgb(19 32 28 / 6%), 0 8px 24px rgb(19 32 28 / 6%);
  --f-display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
  --r: 14px; --r-sm: 10px;
  --t-xs: .75rem; --t-sm: .8125rem; --t-md: .9375rem; --t-lg: 1.125rem; --t-xl: 1.5rem; --t-2xl: 2.25rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1211; --surface: #151C1A; --surface-2: #1C2523; --ink: #E6EEEB; --muted: #94A49F; --line: #283331;
  --accent: #A3A9FF; --accent-ink: #11152E; --accent-soft: #262B55;
  --good: #52C690; --good-soft: #17352A; --calm: #74B0DD; --calm-soft: #172C3B;
  --warn: #E6B05A; --warn-soft: #3A2C12; --risk: #F2847B; --risk-soft: #3D1D1B;
  --c1: #A3A9FF; --c2: #52C690; --c3: #E6B05A; --c4: #74B0DD; --c5: #C996E0; --c6: #F2847B; --c7: #8CC2B6; --c8: #BFB09E;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 25%); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1211; --surface: #151C1A; --surface-2: #1C2523; --ink: #E6EEEB; --muted: #94A49F; --line: #283331;
  --accent: #A3A9FF; --accent-ink: #11152E; --accent-soft: #262B55;
  --good: #52C690; --good-soft: #17352A; --calm: #74B0DD; --calm-soft: #172C3B;
  --warn: #E6B05A; --warn-soft: #3A2C12; --risk: #F2847B; --risk-soft: #3D1D1B;
  --c1: #A3A9FF; --c2: #52C690; --c3: #E6B05A; --c4: #74B0DD; --c5: #C996E0; --c6: #F2847B; --c7: #8CC2B6; --c8: #BFB09E;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 25%); color-scheme: dark; }

* { box-sizing: border-box; }
.ic { width: 18px; height: 18px; flex: none; }
html, body { height: 100%; overscroll-behavior: none; } /* يمنع «اسحب للتحديث» والارتداد الذي يخرج من التطبيق */
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--t-md); line-height: 1.6; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button, label, a, .btn, [data-act], [data-nav] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:active, .btn:active, .more-link:active, .li.clickable:active { opacity: .7; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.3; }
h1 { font-size: var(--t-xl); } h2 { font-size: var(--t-lg); } h3 { font-size: var(--t-md); }
p { margin: 0; }
a { color: var(--accent); }
.num, .amt { font-family: var(--f-display); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.cur { font-size: .78em; color: var(--muted); font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: var(--t-sm); }
.xs { font-size: var(--t-xs); }
.eyebrow { font-size: var(--t-xs); color: var(--muted); letter-spacing: .02em; font-weight: 500; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── الهيكل ── */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.main { min-width: 0; padding-block: 12px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.wrap > *, .card, .li, .stmt, .sheet-body { min-width: 0; }
.li .t, .li .s, .ded b, .mrow b, .stmt h2, .goal h3 { overflow-wrap: anywhere; }
.topbar { min-width: 0; max-width: 100%; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 8px; margin-bottom: 4px; }
.topbar h1 { font-size: var(--t-lg); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 600; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 15px; flex: none; }
.rail { display: none; }
.tabbar { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; }
.tab { appearance: none; border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 8px 2px 8px; min-height: 58px; font-size: 11px; color: var(--muted); cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); font-weight: 600; }
.tab-fab { position: relative; }
.fab { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: var(--shadow); cursor: pointer; transform: translateY(-14px); }
.fab svg { width: 26px; height: 26px; }
@media (min-width: 980px) {
  .app { grid-template-columns: 248px 1fr; }
  .rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-inline-end: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
  .rail .brand { padding: 4px 8px 18px; }
  .rail-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r-sm); color: var(--ink); text-decoration: none; border: 0; background: none; cursor: pointer; text-align: start; font-size: var(--t-md); }
  .rail-link svg { width: 20px; height: 20px; color: var(--muted); }
  .rail-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .rail-link[aria-current="page"] svg { color: var(--accent); }
  .rail-add { margin-block: 6px 14px; }
  .tabbar { display: none; }
  .main { padding-block: 20px 48px; }
  .topbar .mobile-only { display: none; }
}

/* ── عناصر ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font-size: var(--t-md); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: grid; gap: 8px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; min-height: 44px; padding: 8px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-weight: 500; text-decoration: none; }
.btn svg { width: 18px; height: 18px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--risk); border-color: color-mix(in srgb, var(--risk) 40%, transparent); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: var(--t-sm); border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { appearance: none; border: 0; background: transparent; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--ink); position: relative; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.badge-dot { position: absolute; top: 6px; inset-inline-end: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--risk); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-family: var(--f-display); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: var(--t-xs); background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.lvl-comfortable { --lc: var(--good); --ls: var(--good-soft); }
.lvl-balanced { --lc: var(--calm); --ls: var(--calm-soft); }
.lvl-pressing { --lc: var(--warn); --ls: var(--warn-soft); }
.lvl-risk { --lc: var(--risk); --ls: var(--risk-soft); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: var(--t-xs); font-weight: 600; background: var(--ls); color: var(--lc); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--lc); }
.st-paid { color: var(--good); } .st-skipped { color: var(--muted); text-decoration: line-through; }

/* البطل: الرصيد الآمن وشريط الدورة */
.hero { display: grid; gap: 14px; }
.hero-num { font-size: clamp(2rem, 8vw, 2.9rem); font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.ruler { position: relative; height: 54px; margin-top: 4px; }
.ruler-track { position: absolute; inset-inline: 0; top: 24px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.ruler-fill { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--accent); opacity: .85; border-radius: 3px; }
.ruler-dot { position: absolute; top: 20px; width: 14px; height: 14px; margin-inline-start: -7px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.ruler-dot.inc { border-color: var(--good); background: var(--good-soft); top: 18px; width: 18px; height: 18px; margin-inline-start: -9px; }
.ruler-dot.paid { background: var(--ink); }
.ruler-today { position: absolute; top: 6px; bottom: 6px; width: 2px; background: var(--accent); }
.ruler-today span { position: absolute; top: -6px; inset-inline-start: 6px; font-size: 11px; color: var(--accent); white-space: nowrap; font-weight: 600; }
.ruler-ends { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--muted); }
.cta-month { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 16px 18px; border-radius: var(--r); border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; text-align: start; min-height: 64px; }
.cta-month strong { font-family: var(--f-display); font-size: var(--t-lg); font-weight: 600; display: block; }
.cta-month svg { width: 24px; height: 24px; flex: none; }

/* بطاقات الأرقام */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1180px) { .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.tile .v { font-family: var(--f-display); font-size: var(--t-lg); font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .k { font-size: var(--t-xs); color: var(--muted); }
.tile .s { font-size: var(--t-xs); color: var(--muted); }

/* القوائم */
.list { display: grid; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--cc, var(--accent)) 14%, transparent); color: var(--cc, var(--accent)); flex: none; }
.li-ic svg { width: 19px; height: 19px; }
.li-main { min-width: 0; }
.li-main > button.li-t { display: block; min-height: 44px; padding-block: 10px; margin-block: -10px; width: 100%; color: inherit; font: inherit; font-weight: 500; }
.li-t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-s { font-size: var(--t-xs); color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.li-end { text-align: end; display: grid; gap: 4px; justify-items: end; }
.li-end .amt { font-weight: 600; }
.li-paid { display: flex; align-items: center; gap: 2px; }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 9px; }
.icon-btn.sm svg { width: 17px; height: 17px; }
.li.clickable { cursor: pointer; }
.li.clickable:hover .li-t { color: var(--accent); }
.li-actions { display: flex; gap: 6px; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 4px; border-bottom: 1px solid var(--line); font-weight: 600; font-family: var(--f-display); font-size: var(--t-sm); }

/* شلال الحساب */
.wf { display: grid; gap: 0; }
.wf-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); align-items: baseline; }
.wf-row.total { border-bottom: 0; border-top: 2px solid var(--ink); font-weight: 600; padding-top: 11px; }
.wf-row .op { color: var(--muted); font-family: var(--f-display); margin-inline-end: 6px; }
.wf-row small { display: block; color: var(--muted); font-size: var(--t-xs); font-weight: 400; }
.neg { color: var(--risk); } .pos { color: var(--good); }

/* الرسوم */
.chart { width: 100%; overflow-x: auto; }
.chart svg { direction: ltr; display: block; width: 100%; height: auto; min-width: 520px; }
.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--t-xs); color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 30%) 1fr auto; gap: 10px; align-items: center; font-size: var(--t-sm); }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; background: var(--cc, var(--accent)); }

/* التبويبات والمقاطع */
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 12px; flex-wrap: wrap; max-width: 100%; }
.seg, .chips, .choice { position: relative; }
.seg input, .chips input, .choice input { position: absolute; top: 0; inset-inline-start: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; margin: 0; }
.seg label, .seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer; font-size: var(--t-sm); min-height: 36px; display: inline-flex; align-items: center; color: var(--muted); }
.seg input:checked + label, .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); }
.cycle-nav { display: flex; align-items: center; gap: 6px; }
.cycle-nav select { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }

/* النماذج */
.form { display: grid; gap: 14px; }
.f { display: grid; gap: 6px; min-width: 0; }
.f > label, .f > .lbl { font-size: var(--t-sm); font-weight: 500; }
.f .hint { font-size: var(--t-xs); color: var(--muted); }
.in, .f select, .f textarea { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; }
.f textarea { min-height: 72px; resize: vertical; }
.in:focus, .f select:focus, .f textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.in, .f select, .f textarea, .cycle-nav select { font-size: 16px; } /* 16px يمنع التكبير التلقائي في iOS */
.in[type="date"] { direction: ltr; text-align: right; -webkit-appearance: none; appearance: none; display: block; line-height: 28px; cursor: pointer; }
.in[type="date"]::-webkit-date-and-time-value { text-align: right; }
.in[type="date"]::-webkit-calendar-picker-indicator { opacity: .7; cursor: pointer; }
.in[type="file"] { padding: 10px; line-height: 1.4; }
.in[type="file"]::file-selector-button { font: inherit; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 9px; padding: 6px 12px; margin-inline-end: 10px; cursor: pointer; }
.seg label, .chips label, .choice label, .check { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.in.big { font-family: var(--f-display); font-size: var(--t-xl); text-align: center; direction: ltr; }
.in[aria-invalid="true"] { border-color: var(--risk); }
.err { color: var(--risk); font-size: var(--t-sm); }
.f2 { display: grid; gap: 12px; align-items: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips label { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: var(--t-sm); cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); }
.chips input:checked + label { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chips input:focus-visible + label { outline: 3px solid var(--accent); }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.months-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.months-grid label { justify-content: center; }

/* الورقة السفلية والحوار */
.scrim { position: fixed; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100%); z-index: 50; background: rgb(8 12 11 / 50%);
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-top: max(12px, env(safe-area-inset-top, 0px)); overscroll-behavior: contain; animation: fade .15s ease; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 20px 20px 0 0; animation: up .2s ease; box-shadow: 0 -8px 30px rgb(0 0 0 / 18%); }
.sheet-grip { flex: none; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 2px; }
.sheet-h { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-h h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 14px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.sheet-foot { flex: none; display: flex; gap: 8px; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }
.sheet-foot .btn { flex: 1; min-height: 48px; }
@media (min-width: 720px) { .scrim { justify-content: center; padding-bottom: 24px; } .sheet { border-radius: 20px; max-height: min(88%, 900px); } .sheet-grip { display: none; } }
html.sheet-open { overscroll-behavior: none; }
html.sheet-open body { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; } /* top يُضبط بالسكربت ليبقى المحتوى في مكانه */
body.sheet-open .toast-root { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 10px); }
@keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(30px); opacity: .4; } }
.toast-root { position: fixed; z-index: 60; inset-inline: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; pointer-events: none; padding-inline: 16px; }
@media (min-width: 980px) { .toast-root { bottom: 24px; } }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: 520px; animation: up .2s ease; }
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 700; cursor: pointer; min-height: 36px; padding: 0 6px; }

/* تقويم */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { text-align: center; font-size: var(--t-xs); color: var(--muted); padding: 4px 0; }
.cal-d { min-height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 4px 5px; display: grid; align-content: start; gap: 2px; cursor: pointer; text-align: start; min-width: 0; }
.cal-d.out { opacity: .4; }
.cal-d.today { border-color: var(--accent); border-width: 2px; }
.cal-d.sel { background: var(--accent-soft); }
.cal-d.cyc { box-shadow: inset 0 -3px 0 var(--accent); }
.cal-n { font-family: var(--f-display); font-size: var(--t-sm); }
.cal-dots { display: flex; gap: 2px; flex-wrap: wrap; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
.cal-dots i.inc { background: var(--good); } .cal-dots i.ins { background: var(--accent); } .cal-dots i.paid { opacity: .35; }
.cal-amt { font-size: 10px; color: var(--muted); font-family: var(--f-display); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; direction: ltr; text-align: end; }
@media (max-width: 420px) { .cal-d { min-height: 52px; } .cal-amt { display: none; } }

/* التوقع */
.fc-list { display: grid; gap: 8px; }
.fc { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px 12px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; text-align: start; width: 100%; }
.fc-stripe { align-self: stretch; border-radius: 2px; background: var(--lc); }
.fc-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: var(--t-xs); color: var(--muted); }
.fc-meta b { color: var(--ink); font-weight: 500; font-family: var(--f-display); }
.reason { display: grid; grid-template-columns: auto 1fr; gap: 8px; font-size: var(--t-sm); align-items: start; }
.reason::before { content: ""; width: 6px; height: 6px; margin-top: .55em; border-radius: 50%; background: var(--lc, var(--muted)); }
.insight { border-inline-start: 3px solid var(--lc, var(--accent)); padding: 4px 12px; display: grid; gap: 4px; }

/* شاشة الإعداد والقفل */
.center-screen { min-height: 100%; display: grid; place-items: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wizard { width: 100%; max-width: 560px; display: grid; gap: 18px; }
.steps { display: flex; gap: 4px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }
.choice { display: grid; gap: 8px; }
.choice label { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; background: var(--surface); }
.choice input:checked + label { border-color: var(--accent); background: var(--accent-soft); }
.choice input:focus-visible + label { outline: 3px solid var(--accent); }
.pin-dots { display: flex; gap: 14px; justify-content: center; direction: ltr; }
.pin-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); }
.pin-dots i.on { background: var(--ink); }
.keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; justify-content: center; direction: ltr; }
.key { width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: var(--t-xl); cursor: pointer; }
.key:active { background: var(--surface-2); }
.empty { text-align: center; padding: 28px 12px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty svg { width: 40px; height: 40px; color: var(--accent); }
.empty h3 { color: var(--ink); }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--t-sm); min-width: 560px; }
.t th, .t td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: start; white-space: nowrap; }
.t th { font-size: var(--t-xs); color: var(--muted); font-weight: 500; }
.t td.n, .t th.n { text-align: end; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.t tfoot td { font-weight: 600; border-top: 2px solid var(--ink); border-bottom: 0; }
.progress { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.more-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.more-link { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; text-align: start; width: 100%; }
.more-link svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.notice { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--ls, var(--surface-2)); }
.notice svg { width: 20px; height: 20px; color: var(--lc, var(--accent)); margin-top: 2px; }
.notif { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.notif.read { opacity: .6; }
.notif .bar { align-self: stretch; border-radius: 2px; background: var(--lc); }
.lvl-info { --lc: var(--calm); --ls: var(--calm-soft); } .lvl-warn { --lc: var(--warn); --ls: var(--warn-soft); } .lvl-good { --lc: var(--good); --ls: var(--good-soft); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: var(--t-sm); }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
#print-root { position: fixed; top: 0; left: -10000px; width: 794px; background: #fff; color: #111; direction: rtl; font-family: var(--f-body); padding: 36px; }
#print-root h1 { font-size: 22px; } #print-root table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
#print-root th, #print-root td { border-bottom: 1px solid #ccc; padding: 6px; text-align: right; }
#print-root .n { text-align: left; direction: ltr; }
.fc > span:last-child { white-space: nowrap; }
.f.wide { grid-column: 1 / -1; }

/* كشف الراتب */
.stmt { display: grid; gap: 12px; }
.stmt-tabs { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
.stmt-tabs button { justify-content: center; min-height: 40px; font-size: var(--t-md); }
.stmt-head h2 { font-size: var(--t-lg); }
.stmt-bar { height: 12px; border-radius: 6px; background: var(--good-soft); display: flex; overflow: hidden; }
.stmt-bar i { display: block; height: 100%; }
.stmt-bar .done { background: var(--risk); }
.stmt-bar .next { background: color-mix(in srgb, var(--risk) 40%, transparent); }
.stmt-rows { display: grid; }
.stmt-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: var(--t-md); }
.stmt-row b { font-family: var(--f-display); font-size: var(--t-lg); font-weight: 600; }
.stmt-row small { color: var(--muted); font-size: var(--t-xs); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 6px; vertical-align: 0; }
.dot.done { background: var(--risk); } .dot.next { background: color-mix(in srgb, var(--risk) 40%, transparent); }
.neg.soft { opacity: .8; }
.stmt-left { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--good-soft); color: var(--good); flex-wrap: wrap; }
.stmt-left span { font-weight: 600; }
.stmt-left strong { font-family: var(--f-display); font-size: clamp(1.6rem, 7vw, 2.2rem); font-weight: 600; line-height: 1.1; }
.stmt-left.over { background: var(--risk-soft); color: var(--risk); }
.stmt-left .cur { color: inherit; opacity: .8; }
/* قائمة الخصميات */
.ded { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start; cursor: pointer; min-height: 60px; }
.ded:last-child { border-bottom: 0; }
.ded-day { display: grid; justify-items: center; line-height: 1.1; padding: 6px 0; border-radius: 10px; background: color-mix(in srgb, var(--cc, var(--risk)) 13%, transparent); color: var(--cc, var(--risk)); }
.ded-day b { font-family: var(--f-display); font-size: var(--t-lg); }
.ded-day small { font-size: 10px; }
.ded-main { display: grid; gap: 2px; min-width: 0; }
.ded-t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ded-t small { color: var(--muted); font-weight: 400; }
.ded-s { font-size: var(--t-xs); color: var(--muted); display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.ded-s .ic { width: 13px; height: 13px; color: var(--good); }
.ded-amt { color: var(--risk); font-weight: 600; font-size: var(--t-md); white-space: nowrap; }
.ded.is-done .ded-t, .ded.is-done .ded-amt { opacity: .62; }
.ded.is-skip .ded-amt { text-decoration: line-through; color: var(--muted); }
.ded.inc .ded-amt { color: var(--good); }
.ded.inc .ded-day { --cc: var(--good); }
.ded-h { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 6px; border-bottom: 1px solid var(--line); font-family: var(--f-display); font-weight: 600; font-size: var(--t-sm); }
.ded-h:first-of-type { padding-top: 2px; }
/* الرواتب القادمة */
.months { display: grid; }
.mrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; padding: 12px 10px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: start; cursor: pointer; border-inline-start: 4px solid var(--good); min-height: 58px; }
.mrow.warn { border-inline-start-color: var(--warn); } .mrow.bad { border-inline-start-color: var(--risk); }
.mrow-t { display: grid; gap: 2px; min-width: 0; }
.mrow-t small { font-size: var(--t-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow-n { display: grid; justify-items: end; gap: 0; }
.mrow-n b { font-family: var(--f-display); font-size: var(--t-lg); color: var(--good); }
.mrow.warn .mrow-n b { color: var(--warn); } .mrow.bad .mrow-n b { color: var(--risk); }
.mrow-n small { font-family: var(--f-display); font-size: var(--t-xs); }
/* تفاصيل قابلة للطي */
.more-details summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; min-height: 32px; }
.more-details summary::-webkit-details-marker { display: none; }
.more-details summary h2 { font-size: var(--t-md); }
.more-details[open] summary .ic { transform: rotate(-90deg); }
/* هذا الراتب في تفاصيل البند */
.near { display: grid; gap: 8px; }
.near-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.near-row > div:first-child { display: grid; }
.near-row b { font-family: var(--f-display); font-size: var(--t-lg); }
.near-row .li-actions { grid-column: 1 / -1; flex-wrap: wrap; }
@media (max-width: 979px) { .toast-root { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 10px); } }
.toast { pointer-events: none; } .toast button { pointer-events: auto; } /* الرسالة لا تحجب ما تحتها إلا زر «تراجع» */
@media (max-width: 979px) { .toast-root { top: calc(env(safe-area-inset-top, 0px) + 64px); } body.sheet-open .toast-root { top: calc(env(safe-area-inset-top, 0px) + 10px); } }
/* مسموح اليوم */
.today-box { display: grid; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); }
.today-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.today-row > div { display: grid; }
.today-row strong { font-family: var(--f-display); font-size: clamp(1.5rem, 6.5vw, 2rem); font-weight: 600; color: var(--accent); line-height: 1.15; }
.today-box.over { background: var(--risk-soft); } .today-box.over strong { color: var(--risk); }
.today-bar { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 18%, transparent); overflow: hidden; }
.today-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.today-box.over .today-bar i { background: var(--risk); }
.today-box .xs { color: var(--muted); }
/* خريطة السنة */
.ymap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 720px) { .ymap { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.ytile { position: relative; display: grid; gap: 2px; justify-items: center; padding: 10px 4px 12px; border-radius: 10px; border: 0; cursor: pointer; background: var(--ls); color: var(--lc); min-height: 62px; overflow: hidden; }
.ytile small { font-size: var(--t-xs); color: var(--ink); opacity: .8; }
.ytile b { font-family: var(--f-display); font-size: var(--t-md); }
.ytile i { position: absolute; inset: auto 0 0 0; height: 4px; background: var(--lc); }
/* ملاحظات ذكية */
.tip { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--ls, var(--surface-2)); }
.tip > .ic { width: 20px; height: 20px; color: var(--lc, var(--accent)); margin-top: 3px; }
#wi-result { display: grid; gap: 10px; }
#wi-result tr.lvl-pressing td:last-child { color: var(--warn); } #wi-result tr.lvl-risk td:last-child { color: var(--risk); }
.ytile em { position: absolute; top: 3px; inset-inline-start: 5px; font-style: normal; font-size: 9px; font-family: var(--f-display); color: var(--ink); opacity: .7; }
.ytile { padding-top: 14px; }
.file-btn { justify-self: start; }
.sr:focus-visible + .file-btn, .file-btn:focus-within { outline: 3px solid var(--accent); }

/* ───── Pro ───── */
.paywall { display: grid; gap: 12px; }
.pw-reason { font-weight: 600; line-height: 1.7; }
.pw-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pw-list li { display: flex; gap: 10px; align-items: center; }
.pw-list svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.plans { display: grid; gap: 10px; }
.plan { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 64px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); text-align: start; cursor: pointer; font: inherit; }
.plan.best { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.plan:disabled { cursor: default; opacity: .92; }
.plan-t { display: grid; gap: 2px; min-width: 0; } .plan-t b { font-size: var(--t-md); } .plan-t small { color: var(--muted); font-size: var(--t-xs); }
.plan-p { font-family: var(--f-display); font-weight: 800; font-size: var(--t-lg); white-space: nowrap; }
.plan-badge { position: absolute; top: -10px; inset-inline-start: 12px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.ytile.locked { background: var(--surface-2); color: var(--muted); }
.ytile.locked svg { width: 18px; height: 18px; }
.mrow.locked { border-style: dashed; }
.mrow.locked svg { width: 16px; height: 16px; vertical-align: -3px; }
.seg button svg { width: 14px; height: 14px; vertical-align: -2px; margin-inline-end: 3px; }
.pro-card h2 svg { width: 18px; height: 18px; vertical-align: -3px; color: var(--accent); }
.chip.good { background: var(--good); color: #fff; }
.pro-notice { border-color: var(--accent); }
.plan:focus { outline: none; } .plan:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.today-left { margin: 0; font-size: var(--t-sm, .9rem); }
.today-left b { color: var(--ink); font-family: var(--f-display); }
.today-cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.today-cmp .tc { display: grid; gap: 1px; justify-items: start; text-align: start; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font: inherit; min-width: 0; }
.today-cmp .tc.on { border-color: var(--accent); cursor: pointer; }
.today-cmp .tc b { font-family: var(--f-display); font-size: var(--t-lg, 1.25rem); color: var(--accent); line-height: 1.2; }
.today-cmp .tc:not(.on) b { color: var(--ink); }
.today-cmp small { font-size: var(--t-xs, .75rem); color: var(--muted); overflow-wrap: anywhere; }
.today-save { display: grid; gap: 6px; }
.today-save .btn small { font-weight: 400; }
.save-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.save-opt { display: grid; gap: 2px; padding: 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; text-align: center; min-height: 60px; }
.save-opt.on { border-color: var(--accent); background: var(--accent-soft); }
.save-opt b { font-family: var(--f-display); font-size: var(--t-md, 1.05rem); } .save-opt small { color: var(--muted); font-size: var(--t-xs, .75rem); }
.today-cmp small svg { width: 12px; height: 12px; vertical-align: -1px; color: var(--accent); }

.today-when, .today-if { margin: 0; font-size: var(--t-sm, .9rem); }
.today-when { color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }
.today-when svg { width: 15px; height: 15px; flex: none; margin-top: 4px; }
.today-if b { font-family: var(--f-display); color: var(--ink); }
.today-if.warn { color: var(--risk); font-weight: 600; }
.today-warn { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--risk-soft); color: var(--ink); font-size: var(--t-sm, .9rem); }
.today-warn.soft { background: var(--warn-soft, var(--surface)); }
.today-warn svg { width: 16px; height: 16px; flex: none; margin-top: 4px; color: var(--risk); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }

.pace-alert { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); font-size: var(--t-sm, .9rem); line-height: 1.6; }
.pace-alert.lvl-risk { background: var(--risk-soft); }
.pace-alert svg { width: 17px; height: 17px; flex: none; margin-top: 3px; color: var(--warn); }
.pace-alert.lvl-risk svg { color: var(--risk); }
.pace-alert div { display: grid; gap: 2px; min-width: 0; } .pace-alert b { font-weight: 700; } .pace-alert span { color: var(--ink); opacity: .85; }

    for (let i = lo; i < ix.once.length && ix.once[i][0] < to; i++) cand.push(ix.once[i][1]);
    for (const it of cand) {
      for (const o of occurrences(it, from, to)) {
        if (effectiveCycleOf(o, it, s, grace) === key) out.push(Object.assign({ item: it }, o));
      }
    }
    out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    return out;
  }
  const STYLE = {
    conservative: { ratioRisk: 0.55, ratioPress: 0.45, ratioBal: 0.30, dispPress: 0.10, dispBal: 0.25, flex: 0.4 },
    balanced: { ratioRisk: 0.65, ratioPress: 0.50, ratioBal: 0.35, dispPress: 0.05, dispBal: 0.15, flex: 0.6 },
    flexible: { ratioRisk: 0.75, ratioPress: 0.60, ratioBal: 0.45, dispPress: 0.03, dispBal: 0.10, flex: 0.8 }
  };
  function savingTarget(state) {
    const goalsMonthly = (state.goals || []).filter((g) => !g.deletedAt && g.status !== 'done').reduce((a, g) => a + toH(g.monthly || 0), 0);
    return fromH(toH(state.settings.savingMonthly || 0) + goalsMonthly);
  }
  function summarizeCycle(state, key, ctx) { return memo('sum', state, key + '|' + JSON.stringify(ctx || {}), () => summarizeCycleRaw(state, key, ctx)); }
  function summarizeCycleRaw(state, key, ctx) {
    ctx = ctx || {};
    const occ = cycleOccurrences(state, key);
    const inc = occ.filter((o) => o.kind === 'income');
    const exp = occ.filter((o) => o.kind === 'expense');
    const byType = {}; Object.keys(EXPENSE_TYPES).forEach((t) => { byType[t] = 0; });
    exp.forEach((o) => { byType[o.item.type] = r2((byType[o.item.type] || 0) + o.amount); });
    const byCat = {};
    exp.forEach((o) => { const c = o.item.categoryId || 'other'; byCat[c] = r2((byCat[c] || 0) + o.amount); });
    const income = sum(inc, (o) => o.amount);
    const expenses = sum(exp, (o) => o.amount);
    const net = r2(income - expenses);
    const commitments = r2(byType.fixed + byType.installment);
    const ratio = income > 0 ? commitments / income : (commitments > 0 ? Infinity : 0);
    const target = ctx.savingTarget != null ? ctx.savingTarget : savingTarget(state);
    const reserveMin = Number(state.settings.reserveMin) || 0;
    const opening = ctx.opening != null ? ctx.opening : null; // الرصيد القابل للصرف في بداية الدورة
    const reserveTopUp = opening == null ? 0 : r2(Math.max(0, reserveMin - opening));
    const disposable = r2(net - target - reserveTopUp);
    const st = STYLE[state.settings.style] || STYLE.balanced;
    const flexAllowance = r2(Math.max(0, disposable) * st.flex);
    const possibleSaving = r2(Math.max(0, net - reserveTopUp));
    const remaining = r2(disposable - flexAllowance);
    const r = cycleRange(key, state.settings);
    return {
      key, name: cycleName(key), start: r.start, end: addDays(r.end, -1), endExclusive: r.end,
      incomes: inc, expenses: exp, income, expensesTotal: expenses, net, byType, byCat,
      installments: byType.installment, subscriptions: byType.subscription,
      commitments, ratio, savingTarget: target, reserveTopUp, disposable, flexAllowance, possibleSaving, remaining
    };
  }

  /* ───────────── التوقع ─────────────
   * الرصيد المعروف (balance.amount بتاريخ balance.asOf) هو الرصيد القابل للصرف بدون حساب الادخار.
   * كل استحقاق بعد asOf يغيّر الرصيد. الادخار يُحوَّل عند بداية الدورة (أو يُعتبر منفذاً إن سُجّل). */
  function classify(state, s, endSpendable) {
    const st = STYLE[state.settings.style] || STYLE.balanced;
    const reserveMin = Number(state.settings.reserveMin) || 0;
    const reasons = [];
    const pct = (x) => `${Math.round(x * 100)}%`;
    const money = (x) => `${Math.round(x).toLocaleString('en-US')} ر.س`;
    const dispPct = s.income > 0 ? s.disposable / s.income : -1;
    let level = 'comfortable';
    if (s.income === 0 && s.expensesTotal > 0) { level = 'risk'; reasons.push(`لا يوجد دخل مستحق في هذه الدورة مقابل مصروفات ${money(s.expensesTotal)}.`); }
    if (endSpendable < 0) { level = 'risk'; reasons.push(`الرصيد المتوقع في نهاية الدورة سالب (${money(endSpendable)}).`); }
    if (s.income > 0 && s.ratio >= st.ratioRisk) { level = 'risk'; reasons.push(`الالتزامات الأساسية والأقساط تستهلك ${pct(s.ratio)} من الدخل (الحد ${pct(st.ratioRisk)}).`); }
    if (level !== 'risk') {
      if (s.disposable < 0) { level = 'pressing'; reasons.push(`المصروفات مع الادخار المستهدف تتجاوز الدخل بـ ${money(-s.disposable)}.`); }
      if (s.income > 0 && s.ratio >= st.ratioPress) { level = 'pressing'; reasons.push(`نسبة الالتزامات ${pct(s.ratio)} أعلى من ${pct(st.ratioPress)}.`); }
      if (s.disposable >= 0 && dispPct < st.dispPress && s.income > 0) { level = 'pressing'; reasons.push(`الفائض بعد الادخار ${money(s.disposable)} فقط (${pct(dispPct)} من الدخل).`); }
      if (endSpendable < reserveMin) { level = 'pressing'; reasons.push(`الرصيد المتوقع ${money(endSpendable)} أقل من الاحتياطي المطلوب ${money(reserveMin)}.`); }
    }
    if (level === 'comfortable') {
      if (s.income > 0 && s.ratio >= st.ratioBal) { level = 'balanced'; reasons.push(`نسبة الالتزامات ${pct(s.ratio)} ضمن المقبول لكنها فوق ${pct(st.ratioBal)}.`); }
      if (dispPct < st.dispBal) { level = 'balanced'; reasons.push(`الفائض ${pct(Math.max(0, dispPct))} من الدخل، أقل من ${pct(st.dispBal)}.`); }
    }
    if (level === 'comfortable') reasons.push(`الالتزامات ${pct(s.ratio === Infinity ? 0 : s.ratio)} من الدخل، والفائض ${money(s.disposable)} (${pct(dispPct)}).`);
    const big = s.expenses.filter((o) => ['scheduled', 'emergency'].includes(o.item.type) && o.amount >= Math.max(500, s.income * 0.08));
    big.forEach((o) => reasons.push(`يستحق «${o.item.name}» بمبلغ ${money(o.amount)} في ${o.date}.`));
    return { level, reasons };
  }
  const LEVELS = { comfortable: 'مريح', balanced: 'متوازن', pressing: 'ضاغط', risk: 'خطر' };

  /** هل الاستحقاق لم ينعكس بعد في الرصيد المُدخل؟
   * قبل asOf: منعكس. بعده: معلّق. في نفس اليوم: معلّق ما لم يُسجَّل مدفوعاً قبل تحديث الرصيد. */
  function isPending(o, bal, asOf) {
    if (o.date > asOf) return true;
    if (o.date < asOf) return false;
    if (o.status !== 'paid') return true;
    const setAt = bal && bal.setAt;
    return !o.paidAt || !setAt || o.paidAt > setAt;
  }
  function forecast(state, opts) {
    const o = opts || {};
    return memo('fc', state, JSON.stringify({ t: o.today, m: o.months, k: o.startKey, p: !!o.patch }), () => forecastRaw(state, opts));
  }
  function forecastRaw(state, opts) {
    opts = opts || {};
    const s = state.settings;
    const today = opts.today || todayIn(s.timezone);
    const months = Math.min(24, Math.max(1, Number(opts.months || s.horizon || 12)));
    const asOf = (state.balance && state.balance.asOf) || today;
    let spendable = Number(state.balance && state.balance.amount) || 0;
    let saved = sum((state.goals || []).filter((g) => !g.deletedAt), (g) => g.saved || 0) + (Number(s.savingsBalance) || 0);
    const startKey = opts.startKey || cycleOf(today, s);
    const target = savingTarget(state);
    const rows = [];
    // الاستحقاقات بين asOf وبداية الدورة الأولى (إن كانت asOf أقدم)
    const firstRange = cycleRange(startKey, s);
    if (asOf < firstRange.start) {
      for (let k = cycleOf(asOf, s); keyDiff(k, startKey) > 0; k = keyAdd(k, 1)) {
        const so = cycleOccurrences(state, k).filter((o) => isPending(o, state.balance, asOf));
        spendable = r2(spendable + sum(so, (o) => (o.kind === 'income' ? o.amount : -o.amount)));
      }
    }
    for (let i = 0; i < months; i++) {
      const key = keyAdd(startKey, i);
      const range = cycleRange(key, s);
      const occ = cycleOccurrences(state, key);
      // التدفقات التي لم تنعكس بعد في الرصيد
      const pending = occ.filter((o) => isPending(o, state.balance, asOf));
      const flow = sum(pending, (o) => (o.kind === 'income' ? o.amount : -o.amount));
      const opening = spendable; // قبل تدفقات الدورة غير المنعكسة
      const sumRow = summarizeCycle(state, key, { opening: i === 0 && asOf >= range.start ? null : opening, savingTarget: target });
      const savingDone = (state.savingsLedger || {})[key];
      // الادخار: إن سُجّل تحويله قبل آخر تحديث للرصيد فهو منعكس فيه، وإلا يُخصم من الرصيد القابل للصرف
      let savingThis = 0, savingAmount;
      if (savingDone && savingDone.done) {
        savingAmount = Number(savingDone.amount || 0);
        const bal = state.balance || {};
        const reflected = bal.setAt && savingDone.at && savingDone.at <= bal.setAt && range.start <= asOf;
        savingThis = reflected ? 0 : savingAmount;
      } else { savingThis = r2(Math.max(0, Math.min(target, sumRow.net))); savingAmount = savingThis; }
      const endSpendable = r2(opening + flow - savingThis);
      saved = r2(saved + savingAmount);
      const cls = classify(state, sumRow, endSpendable);
      rows.push({
        key, name: sumRow.name, start: range.start, end: addDays(range.end, -1),
        income: sumRow.income, expenses: sumRow.expensesTotal, net: sumRow.net,
        installments: sumRow.installments, subscriptions: sumRow.subscriptions, byType: sumRow.byType,
        commitments: sumRow.commitments, ratio: sumRow.ratio,
        saving: savingAmount,
        savingDone: !!(savingDone && savingDone.done),
        disposable: sumRow.disposable, flexAllowance: sumRow.flexAllowance, possibleSaving: sumRow.possibleSaving,
        opening, endSpendable, savedTotal: saved, safe: r2(endSpendable - (Number(s.reserveMin) || 0)),
        level: cls.level, levelName: LEVELS[cls.level], reasons: cls.reasons, summary: sumRow

  }

  /** الرصيد الآمن حتى الراتب القادم للدورة الحالية */
  function safeToSpend(state, today) {
    const s = state.settings;
    today = today || todayIn(s.timezone);
    const fc = forecast(state, { today, months: 1 });
    const row = fc.rows[0];
    const occ = row.summary.expenses.concat(row.summary.incomes);
    const upcoming = occ.filter((o) => o.date >= today && o.status !== 'paid' && o.kind === 'expense');
    const nextKey = keyAdd(row.key, 1);
    return {
      key: row.key, nextSalaryCycleStart: cycleRange(nextKey, s).start,
      daysLeft: Math.max(0, diffDays(today, cycleRange(row.key, s).end)),
      safe: row.safe, endSpendable: row.endSpendable,
      upcomingTotal: sum(upcoming, (o) => o.amount), upcoming,
      perDay: row.safe > 0 ? r2(row.safe / Math.max(1, diffDays(today, cycleRange(row.key, s).end))) : 0
    };
  }

  /* ───────────── الذكاء المالي والتوصيات ───────────── */
  function insights(state, rows, today) {
    const out = { endingInstallments: [], bestMonth: null, preSave: [], nextMonthHold: null, cuts: [] };
    if (!rows.length) return out;
    // الأقساط المنتهية
    for (const it of activeItems(state).filter((i) => i.type === 'installment' && i.plan && !i.deletedAt)) {
      const ps = planStatus(it.plan);
      if (!ps.remainingCount) continue;
      const lastKey = cycleOf(ps.lastDue, state.settings);
      const freedFrom = keyAdd(lastKey, 1);
      if (keyDiff(rows[0].key, freedFrom) >= 0 && keyDiff(freedFrom, rows[rows.length - 1].key) >= 0) {
        out.endingInstallments.push({ itemId: it.id, name: it.name, provider: it.plan.provider, lastKey, freedFrom, freedName: cycleName(freedFrom), monthly: ps.monthly, remaining: ps.remainingAmount });
      }
    }
    out.endingInstallments.sort((a, b) => (a.freedFrom < b.freedFrom ? -1 : a.freedFrom > b.freedFrom ? 1 : b.monthly - a.monthly));
    // أفضل شهر للشراء/زيادة الادخار: أعلى فائض قابل للتصرف (بعد الدورة الحالية)
    const cand = rows.slice(1).length ? rows.slice(1) : rows;
    const best = cand.reduce((a, b) => (b.disposable > a.disposable ? b : a), cand[0]);
    out.bestMonth = { key: best.key, name: best.name, disposable: best.disposable, reason: `أعلى فائض متوقع بعد الالتزامات والادخار (${Math.round(best.disposable).toLocaleString('en-US')} ر.س)` + (out.endingInstallments.some((e) => keyDiff(e.freedFrom, best.key) >= 0) ? ' مع انتهاء أقساط قبله' : '') + '.' };
    // الأشهر التي يجب الادخار لها مسبقاً: لكل شهر ضاغط/خطر، العجز يوزع على الأشهر السابقة ذات الفائض
    const thr = (STYLE[state.settings.style] || STYLE.balanced);
    rows.forEach((row, idx) => {
      if (idx === 0) return;
      if (row.level !== 'pressing' && row.level !== 'risk') return;
      const need = r2(Math.max(-row.disposable, (Number(state.settings.reserveMin) || 0) - row.endSpendable, row.income * thr.dispPress - row.disposable, 0));
      if (need <= 0) return;
      const donors = rows.slice(0, idx).filter((r) => r.disposable > 0);
      const cap = sum(donors, (r) => r.disposable);
      const per = donors.length ? r2(Math.min(need, cap) / donors.length) : 0;
      out.preSave.push({ key: row.key, name: row.name, need, perMonth: per, fromMonths: donors.map((d) => d.key), covered: cap >= need });
    });
    // الشهر القادم ضاغط؟ احجز من الحالي
    if (rows.length > 1 && (rows[1].level === 'pressing' || rows[1].level === 'risk')) {
      const ps = out.preSave.find((p) => p.key === rows[1].key);
      const need = ps ? ps.need : Math.max(0, -rows[1].disposable);
      const hold = r2(Math.min(need, Math.max(0, rows[0].disposable)));
      out.nextMonthHold = { key: rows[1].key, name: rows[1].name, need, hold, shortBy: r2(Math.max(0, need - hold)) };
      out.cuts = suggestCuts(state, rows[1].summary, Math.max(0, need - hold));
    }
    return out;
  }
  /** بنود مرنة يمكن تخفيضها دون المساس بالأساسيات */
  function suggestCuts(state, summary, target) {
    const rate = { variable: 0.25, subscription: 1, emergency: 0, scheduled: 0, fixed: 0, installment: 0 };
    const cands = [];
    const groups = {};
    for (const o of summary.expenses) {
      if (o.item.priority === 'essential' || o.status === 'paid') continue;
      const r = o.item.priority === 'flexible' ? (o.item.type === 'subscription' ? 1 : Math.max(0.3, rate[o.item.type] || 0)) : (rate[o.item.type] || 0) * 0.5;
      if (!r) continue;
      const g = groups[o.itemId] || (groups[o.itemId] = { itemId: o.itemId, name: o.item.name, type: o.item.type, amount: 0, rate: r });
      g.amount = r2(g.amount + o.amount);
    }
    for (const g of Object.values(groups)) cands.push(Object.assign(g, { saving: r2(g.amount * g.rate), how: g.rate >= 1 ? 'إيقاف مؤقت لدورة واحدة' : `تخفيض ${Math.round(g.rate * 100)}%` }));
    cands.sort((a, b) => b.saving - a.saving);
    let acc = 0; const picked = [];
    for (const c of cands) { if (target > 0 && acc >= target) break; picked.push(c); acc += c.saving; }
    return picked;
  }

  /* ───────────── التنبيهات ───────────── */
  function notifications(state, today) { return memo('ntf', state, String(today) + JSON.stringify((state.notifState && state.notifState.read) || {}).length, () => notificationsRaw(state, today)); }
  function notificationsRaw(state, today) {
    const s = state.settings; today = today || todayIn(s.timezone);
    const out = [];
    const horizon = addDays(today, Number(s.notifyDays || 3) + 1);
    for (const it of activeItems(state)) {
      if (it.kind !== 'expense') continue;
      for (const o of occurrences(it, addDays(today, -7), horizon)) {
        if (o.status !== 'due') continue;
        if (o.date < today) continue; // المستحق الماضي يُعتبر مخصوماً تلقائياً
        out.push({ key: `due:${it.id}:${o.date}`, level: 'info', title: `قريباً: ${it.name}`, body: `يستحق ${o.date === today ? 'اليوم' : 'في ' + o.date} بمبلغ ${o.amount} ر.س.`, itemId: it.id, date: o.date });
      }
    }
    const fc = forecast(state, { today, months: 3 });
    fc.rows.slice(1).forEach((r) => {
      if (r.level === 'pressing' || r.level === 'risk') out.push({ key: `lvl:${r.key}:${r.level}`, level: r.level === 'risk' ? 'risk' : 'warn', title: `دورة ${r.name} ${r.levelName}`, body: r.reasons[0] || '', cycle: r.key });
    });
    fc.insights.endingInstallments.filter((e) => keyDiff(fc.rows[0].key, e.freedFrom) <= 2).forEach((e) => out.push({ key: `end:${e.itemId}`, level: 'good', title: `ينتهي قسط ${e.name}`, body: `من دورة ${e.freedName} يتحرر ${e.monthly} ر.س شهرياً.`, itemId: e.itemId }));
    // نسبة ما صُرف من الراتب مقابل الأيام الباقية، وتجاوز مسموح اليوم، وتجديد الاشتراكات السنوية
    const db = dailyBudget(state, today);
    if (db.income > 0 && db.daysLeft >= 5) {
      const pct = Math.round(db.spentPct * 100);
      if (pct >= 90) out.push({ key: `spent:${db.key}:90`, level: 'risk', title: `صرفت ${pct}% من راتبك`, body: `وباقي ${db.daysLeft} يوماً على الراتب القادم. المتبقي ${Math.round(db.remainingNow)} ر.س.` });
      else if (pct >= 70) out.push({ key: `spent:${db.key}:70`, level: 'warn', title: `صرفت ${pct}% من راتبك`, body: `وباقي ${db.daysLeft} يوماً على الراتب القادم. المتبقي ${Math.round(db.remainingNow)} ر.س.` });
    }
    if (db.spentToday > 0 && db.todayLeft < 0) { const nextPer = Math.max(0, (db.pool - db.spentToday) / Math.max(1, db.daysLeft - 1)); out.push({ key: `over:${today}`, level: 'warn', title: 'تجاوزت مسموح اليوم', body: db.perDay < 1 ? `صرفت ${mny(db.spentToday)} ر.س وما كان لك مسموح اليوم. كل ريال الآن يُخصم من التزاماتك أو ادخارك.` : nextPer < 1 ? `صرفت ${mny(db.spentToday)} من ${mny(db.perDay)} ر.س. ما بقي لك مسموح للمصاريف حتى الراتب.` : `صرفت ${mny(db.spentToday)} من ${mny(db.perDay)} ر.س. مسموحك من بكرة نزل إلى ${mny(nextPer)} ر.س يومياً (كان ${mny(db.perDay)}).` }); }
    out.unshift(...paceMessages(state, today));
    try {
      const w = wasteReport(state, today, 'cycle'), t0 = w.top[0], catName = (id) => ((state.categories || []).find((c) => c.id === id) || { name: 'أخرى' }).name;
      if (t0 && w.days >= 3 && w.income > 0 && t0.share >= 0.35 && t0.amount >= w.income * 0.05)
        out.push({ key: `waste:${w.from}:${t0.cat}:${Math.floor(t0.amount / 500)}`, level: 'warn', title: `أكثر شيء يضيع فلوسك: ${catName(t0.cat)}`, body: `${mny(t0.amount)} ر.س خلال ${daysAr(w.days)} (${Math.round(t0.share * 100)}% من مصاريفك اليومية). بهذا المعدل ${mny(t0.projected)} ر.س حتى الراتب.` });
    } catch (e) { /* */ }
    for (const it of activeItems(state)) {
      if (it.type !== 'subscription' && it.type !== 'scheduled') continue;
      if (!it.rule || (it.rule.freq !== 'yearly' && !(it.rule.freq === 'monthly' && Number(it.rule.interval) >= 6))) continue;
      for (const o of occurrences(it, today, addDays(today, 15))) if (o.status === 'due') out.push({ key: `renew:${it.id}:${o.date}`, level: 'info', title: `يتجدد قريباً: ${it.name}`, body: `${o.amount} ر.س في ${o.date}. ألغِه قبلها إن لم تعد تحتاجه.`, itemId: it.id, date: o.date });
    }
    const sf = safeToSpend(state, today);
    if (sf.safe < 0 && Number(state.balance && state.balance.amount) > 0) out.push({ key: `safe:${sf.key}`, level: 'risk', title: 'الرصيد الآمن تحت الاحتياطي', body: `ينقصك ${Math.round(-sf.safe)} ر.س للحفاظ على الاحتياطي حتى الراتب القادم.` });
    const read = (state.notifState && state.notifState.read) || {};
    out.forEach((n) => { n.read = !!read[n.key]; });
    return out;
  }

  /* ───────────── مسموح اليوم ─────────────
   * من راتب الدورة الحالية: نطرح كل الالتزامات المخطط لها (ثابتة ومتغيرة وأقساط واشتراكات) والادخار المستهدف
   * والمصروف اليومي قبل اليوم، ثم نقسم الباقي على الأيام المتبقية حتى الراتب القادم (شاملة اليوم). */
  function dailyBudget(state, today) { return memo('db', state, String(today), () => dailyBudgetRaw(state, today)); }
  const mny = (x) => Math.round(x).toLocaleString('en-US');
  const dLabel = (d) => { const p = parse(d); return `${p.d} ${MONTHS_AR[p.m - 1]}`; };

/* ───────── التنزيلات (قدرة المنصة أو رابط عادي خارجها) ───────── */
async function saveFile(filename, data, mime) {
  if (window.__nativeSaveFile) { try { return await window.__nativeSaveFile(filename, data); } catch (e) { return toast('تعذر حفظ الملف: ' + friendlyError(e)); } }
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (dl) {
        try { await dl.save({ filename, data }); toast('تم تجهيز الملف: ' + filename); return; }
        catch (e) { if (e && e.code === 'declined') { toast('أُلغي الحفظ'); return; } if (e && e.code !== 'unavailable' && e.code !== 'not_granted') { toast('تعذر حفظ الملف: ' + friendlyError(e)); return; } }
      }
    }
  } catch (e) { /* أكمل بالطريقة العادية */ }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('تم تنزيل ' + filename);
}
function loadScript(src, globalName) {

  const ready = () => !globalName || !!window[globalName];
  return new Promise((res, rej) => {
    const old = $$('script').find((x) => x.src === src);
    if (old && old.dataset.loaded === '1' && ready()) return res();
    if (old) old.remove();
    const s = document.createElement('script'); s.src = src;
    s.onload = () => { s.dataset.loaded = '1'; ready() ? res() : rej(new Error('تعذر تحميل المكتبة، تحقق من الاتصال بالإنترنت')); };
    s.onerror = () => { s.remove(); rej(new Error('تعذر تحميل المكتبة، تحقق من الاتصال بالإنترنت')); };
    document.head.appendChild(s);

}

function audit(action, summary, entity, id) {

  });

    return `<div class="ded-h"><span>${title} · ${nf(list.length, 0)}</span><span class="neg amt">−${nf(total)}</span></div>${(cut ? list.slice(-3) : list).map(dedRow).join('')}${cut ? `<button class="btn sm ghost block" data-act="show-done">عرض كل ما انخصم (${nf(list.length, 0)})</button>` : fold && list.length > 4 ? '<button class="btn sm ghost block" data-act="show-done">إخفاء</button>' : ''}`; };
  const futureWord = d.isCur ? 'باقي يُخصم' : 'سيُخصم';
  return `<section class="card">
    <div class="card-h"><h2>الخصميات · ${itemsWord(d.done.length + d.next.length + d.daily.length)}</h2><button class="btn sm primary" data-act="add">${icon('plus')} إضافة</button></div>
    ${d.done.length + d.next.length + d.daily.length === 0 ? emptyBlock('receipt', 'لا خصميات في هذا الراتب', 'أضف مصروف البيت والإيجار والأقساط والاشتراكات مرة واحدة، وستظهر هنا كل شهر تلقائياً.', `<button class="btn primary" data-act="add">${icon('plus')} أضف أول خصم</button>`) : ''}
    ${group(futureWord, d.next, d.pending)}
    ${d.daily.length ? `<div class="ded-h"><span>مصاريفك اليومية · ${nf(d.daily.length, 0)}</span><span class="neg amt">−${nf(d.dailyTotal)}</span></div>${(ui.showDaily ? d.daily : d.daily.slice(0, 4)).map(dedRow).join('')}${d.daily.length > 4 ? `<button class="btn sm ghost block" data-act="show-daily">${ui.showDaily ? 'إخفاء' : `عرض الكل (${nf(d.daily.length, 0)})`}</button>` : ''}` : ''}
    ${group('انخصم', d.done, E.r2(d.deducted - d.dailyTotal), d.next.length > 0 || d.done.length > 6)}
    ${d.skipped.length ? `<div class="ded-h"><span>متخطى هذا الشهر</span><span class="muted">${nf(d.skipped.length, 0)}</span></div>${d.skipped.map((o) => `<button class="ded is-skip" data-act="detail" data-id="${o.item.id}"><span class="ded-day"><b>${nf(E.parse(o.date).d, 0)}</b></span><span class="ded-main"><span class="ded-t">${esc(o.item.name)}</span><span class="ded-s">لن يُخصم هذا الشهر</span></span><span class="ded-amt amt">${nf(o.planned)}</span></button>`).join('')}` : ''}
    ${opts.income !== false && incRows ? `<div class="ded-h"><span>الدخل</span><span class="pos amt">+${nf(d.income)}</span></div>${incRows}` : ''}
    <p class="xs muted" style="margin-top:10px">المبالغ الثابتة تُعتبر مخصومة تلقائياً عند حلول تاريخها. اضغط أي بند لتعديل مبلغ هذا الشهر أو تخطيه أو إيقافه.</p>
  </section>`;
}
function monthsAhead(fromKey, n) {
  const lockedN = proActive() ? 0 : Math.max(0, n - PRO.limits.months); n -= lockedN;
  const rows = [];
  for (let i = 0; i < n; i++) { const k = E.keyAdd(fromKey, i); rows.push(stmtData(k)); }
  const big = (d) => d.next.concat(d.done).filter((o) => ['scheduled', 'emergency'].includes(o.item.type) && o.amount >= 500);
  return `<section class="card"><div class="card-h"><h2>الرواتب القادمة</h2><button class="btn sm ghost" data-nav="forecast">التوقع الكامل</button></div>
    <div class="months">${rows.map((d) => { const b = big(d); const low = d.income > 0 && d.left < d.income * 0.15;
      return `<button class="mrow ${d.left < 0 ? 'bad' : low ? 'warn' : ''}" data-act="open-cycle" data-key="${d.key}">
        <span class="mrow-t"><b>${cycleTitle(d.key)}</b><small>${b.length ? 'فيه: ' + b.map((o) => esc(o.item.name)).join('، ') : `${nf(d.next.length + d.done.length, 0)} خصماً`}</small></span>
        <span class="mrow-n"><small class="neg">−${nf(d.deducted + d.pending)}</small><b class="amt">${d.left < 0 ? '−' : ''}${nf(Math.abs(d.left))}</b></span></button>`; }).join('')}${lockedN ? `<button class="mrow locked" data-act="paywall" data-f="forecast"><span class="mrow-t"><b>${icon('lock')} الأشهر التالية وسنتك كاملة</b><small>متاحة في محاسبك Pro</small></span><span class="mrow-n"><b>Pro</b></span></button>` : ''}</div>
    <p class="xs muted">الرقم الكبير = ما يتبقى من الراتب بعد كل الخصميات. الأحمر الصغير = مجموع الخصميات.</p></section>`;
}

/* ───────── ملاحظات ذكية: الهدر والاشتراكات ووتيرة الصرف ───────── */
function smartInsights() {
  const out = [], t = today(), cur = E.cycleOf(t, state.settings), nxt = E.summarizeCycle(state, E.keyAdd(cur, 1));
  const subs = state.items.filter((i) => i.type === 'subscription' && !i.deletedAt && i.rule && (!i.rule.end || i.rule.end >= t));
  if (subs.length) {
    const monthly = E.sum(subs, (i) => { const a = Number(E.versionAt(i, t).amount) || 0, r = i.rule; return r.freq === 'yearly' ? a / 12 : r.freq === 'weekly' ? a * 4.33 : r.freq === 'monthly' ? a / (Number(r.interval) || 1) : 0; });
    out.push({ lvl: 'info', ic: 'repeat', t: `${nf(subs.length, 0)} اشتراكات تكلفك ${moneyText(Math.round(monthly))} شهرياً`, b: `أي ${moneyText(Math.round(monthly * 12))} في السنة. راجع ما لا تستخدمه وأوقفه من تفاصيله.` });
  }
  if (nxt.income > 0) {
    const p = Math.round(nxt.ratio * 100);
    out.push({ lvl: p < 35 ? 'good' : p < 50 ? 'info' : 'warn', ic: 'layers', t: `التزاماتك الثابتة والأقساط ${p}% من راتبك`, b: p < 35 ? 'نسبة ممتازة تترك لك مساحة للادخار.' : p < 50 ? 'نسبة مقبولة. حاول ألا تضيف أقساطاً جديدة قبل انتهاء الحالية.' : 'نسبة مرتفعة. الأفضل ألا تتجاوز النصف؛ جرّب «ماذا لو؟» قبل أي التزام جديد.' });
  }
  const db = E.dailyBudget(state, t), prev = E.summarizeCycle(state, E.keyAdd(cur, -1));
  const curDaily = E.summarizeCycle(state, cur).expenses.filter((o) => o.item.type === 'daily').map((o) => o.date).sort();
  const total = E.diffDays(db.start, db.endExclusive), elapsed = Math.max(1, E.diffDays(curDaily[0] || db.start, t) + 1);
  if (db.dailyTotal > 0) {
    const proj = (db.dailyTotal / elapsed) * total, prevDaily = prev.byType.daily || 0;
    if (prevDaily > 0 && proj > prevDaily * 1.3) out.push({ lvl: 'warn', ic: 'trend', t: `مصاريفك اليومية أعلى من الشهر الماضي بـ ${Math.round((proj / prevDaily - 1) * 100)}%`, b: `بهذه الوتيرة تصل ${moneyText(Math.round(proj))} مقابل ${moneyText(Math.round(prevDaily))} في الراتب السابق.` });
    else out.push({ lvl: 'info', ic: 'cart', t: `متوسط مصروفك اليومي ${moneyText(Math.round(db.dailyTotal / elapsed))}`, b: `صرفت ${moneyText(db.dailyTotal)} خلال ${nf(elapsed, 0)} ${elapsed === 1 ? 'يوم' : elapsed <= 10 ? 'أيام' : 'يوماً'} من التسجيل.` });
    const curS = E.summarizeCycle(state, cur), byCat = {}, prevCat = {};
    curS.expenses.filter((o) => o.item.type === 'daily').forEach((o) => { byCat[o.item.categoryId] = (byCat[o.item.categoryId] || 0) + o.amount; });
    prev.expenses.filter((o) => o.item.type === 'daily').forEach((o) => { prevCat[o.item.categoryId] = (prevCat[o.item.categoryId] || 0) + o.amount; });
    Object.entries(byCat).forEach(([c, v]) => { const pv = prevCat[c] || 0; if (pv > 0 && v > pv * 1.4 && v - pv >= 200) out.push({ lvl: 'warn', ic: catOf(c).icon, t: `${catOf(c).name}: ${moneyText(Math.round(v))} حتى الآن`, b: `مقابل ${moneyText(Math.round(pv))} في الراتب السابق كله.` }); });
  }
  const fc = fcRows(12), e = fc.insights.endingInstallments[0];
  if (e) out.push({ lvl: 'good', ic: 'spark', t: `من ${cycleTitle(e.freedFrom)} يتحرر ${moneyText(e.monthly)} شهرياً`, b: `بانتهاء قسط ${esc(e.name)}. فكّر بتحويله للادخار بدل التزام جديد.` });
  if (!out.length) return '';
  return `<section class="card"><div class="card-h"><h2>ملاحظات ذكية</h2></div><div class="stack">${out.slice(0, 5).map((x) => `<div class="tip lvl-${x.lvl}">${icon(x.ic)}<div><strong>${x.t}</strong><p class="small muted">${x.b}</p></div></div>`).join('')}</div></section>`;
}

/* ───────── الرئيسية ───────── */
function viewHome() {
  const cur = E.cycleOf(today(), state.settings), nextK = E.keyAdd(cur, 1);
  const showNext = ui.homeTab === 'next';

  }

  const saved = cloud.status === 'synced' ? `<p class="xs muted" style="display:flex;gap:6px;align-items:center">${icon('cloud')} محفوظ في حسابك</p>` : '';
  const demoBar = isDemo() ? `<div class="notice lvl-warn demo-bar">${icon('alert')}<div><strong>هذه بيانات تجريبية للتعرّف على التطبيق</strong><p class="small">لما تجهز، اضغط الزر وابدأ ببياناتك أنت: راتبك ويوم نزوله ثم التزاماتك. البيانات التجريبية تُمسح.</p><div class="row" style="margin-top:8px"><button class="btn primary" data-act="leave-demo">${icon('check')} ابدأ ببياناتي الشخصية</button></div></div></div>` : '';
  window.__remindShown = reminderDue();
  const nativeUpd = ui.nativeUpdate && window.__APK_URL ? `<div class="notice lvl-good">${icon('download')}<div><strong>يوجد تحديث جديد للتطبيق</strong><p class="small">نزّل النسخة الجديدة وثبّتها فوق الحالية. بياناتك تبقى كما هي.</p><div class="row" style="margin-top:6px"><a class="btn sm primary" href="${window.__APK_URL}">${icon('download')} نزّل التحديث</a></div><p class="xs muted">بعد التنزيل افتح الملف واضغط «تثبيت» أو «تحديث». إذا رجعت الرسالة بعد التثبيت، انتظر دقائق: النسخة الجديدة لسا تُجهَّز.</p></div></div>` : '';
  return `${topbar(`${hi}${name}`)}${nativeUpd}${demoBar}${reminderCard()}${proHomeNotice()}${storageWarn}${saved}${installCard(true)}
  ${stmtCard(d, { tabs, cta: true })}
  ${wasteCard()}

  <button class="more-link" data-act="whatif">${icon('spark')}<span><strong>ماذا لو؟</strong><span class="xs muted" style="display:block">جرّب أثر شراء أو قسط أو التزام جديد على رواتبك القادمة قبل ما تقرر</span></span></button>`;
}

/* ───────── خصميات أي راتب + التفاصيل ───────── */

  const offset = E.keyDiff(cur, key);

  if (offset >= 0 && offset < 24) row = fcRows(offset + 1).rows[offset];
  const s = E.summarizeCycle(state, key), d = stmtData(key);
  const wf = row ? [
    ['', 'إجمالي الدخل المستحق', row.income, `${nf(s.incomes.length, 0)} دفعة دخل`],
    ['−', 'إجمالي الخصميات', -row.expenses, `منها أقساط ${nf(s.installments)} واشتراكات ${nf(s.subscriptions)}`],
    ['=', 'يتبقى من الراتب', row.net, 'الدخل − الخصميات', 'total'],

    ['−', 'تعزيز الاحتياطي', -row.summary.reserveTopUp, row.summary.reserveTopUp ? 'لرفع رصيدك إلى الحد الأدنى' : 'الاحتياطي مكتمل'],

    <h3 style="margin-block:14px 4px">الحساب خطوة بخطوة</h3><div class="wf">${wf.map(([op, k, v, h, cls]) => `<div class="wf-row ${cls || ''}"><span><span class="op">${op}</span>${k}<small>${h}</small></span><span>${signed(v)}</span></div>`).join('')}</div>

/* ───────── التقويم ───────── */
function viewCalendar() {
  const t = today();
  const mk = ui.calMonth || t.slice(0, 7);
  const [y, m] = mk.split('-').map(Number);
  const first = E.fmt(y, m, 1), days = E.dim(y, m), lead = E.weekday(first);
  const next = E.addMonthsYM(y, m, 1);
  const occ = E.upcoming(state, E.addDays(first, -lead), E.diffDays(E.addDays(first, -lead), E.fmt(next.y, next.m, 1)) + 7);
  const by = {}; occ.forEach((o) => { (by[o.date] = by[o.date] || []).push(o); });
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = E.addDays(first, i - lead); if (i >= 35 && d.slice(0, 7) !== mk) break;
    const list = by[d] || [];
    const exp = E.sum(list.filter((o) => o.kind === 'expense'), (o) => o.amount);
    const isStart = E.cycleRange(E.cycleOf(d, state.settings), state.settings).start === d;
    cells.push(`<button class="cal-d ${d.slice(0, 7) !== mk ? 'out' : ''} ${d === t ? 'today' : ''} ${d === ui.calSel ? 'sel' : ''} ${isStart ? 'cyc' : ''}" data-act="calsel" data-date="${d}" aria-label="${dlabel(d, { wd: true })}${list.length ? '، ' + list.length + ' استحقاقات' : ''}">
      <span class="cal-n">${nf(E.parse(d).d, 0)}</span><span class="cal-dots">${list.slice(0, 6).map((o) => `<i class="${o.kind === 'income' ? 'inc' : o.item.type === 'installment' ? 'ins' : ''} ${o.status !== 'due' ? 'paid' : ''}"></i>`).join('')}</span>${exp ? `<span class="cal-amt">${kfmt(exp)}</span>` : ''}</button>`);
  }
  const sel = ui.calSel || t;
  const selList = (by[sel] || E.upcoming(state, sel, 1));
  const monthOcc = occ.filter((o) => o.date.slice(0, 7) === mk);
  return `${topbar('تقويم الالتزامات')}
  <div class="row spread"><div class="cycle-nav"><button class="icon-btn" data-act="calm" data-step="-1" aria-label="الشهر السابق">${icon('chevR')}</button><h2>${E.MONTHS_AR[m - 1]} ${y}</h2><button class="icon-btn" data-act="calm" data-step="1" aria-label="الشهر التالي">${icon('chevL')}</button></div>
  <div class="legend"><span><i style="background:var(--good)"></i>دخل</span><span><i style="background:var(--ink)"></i>مصروف</span><span><i style="background:var(--accent)"></i>قسط</span><span><i style="background:transparent;box-shadow:inset 0 -3px 0 var(--accent)"></i>بداية دورة</span></div></div>
  <section class="card"><div class="cal" role="grid">${WD.map((w) => `<div class="cal-wd">${w.replace('ال', '').slice(0, 3)}</div>`).join('')}${cells.join('')}</div></section>
  <div class="grid g2">
    <section class="card"><div class="card-h"><h2>${dlabel(sel, { wd: true })}</h2><button class="btn sm" data-act="add" data-date="${sel}">${icon('plus')} إضافة في هذا اليوم</button></div><div class="list">${selList.length ? selList.map((o) => occRow(o)).join('') : emptyBlock('calendar', 'يوم خالٍ', 'لا توجد استحقاقات في هذا اليوم.')}</div></section>
    <section class="card"><div class="card-h"><h2>إجمالي ${E.MONTHS_AR[m - 1]}</h2></div><div class="kv"><dt>الدخل</dt><dd>${money(E.sum(monthOcc.filter((o) => o.kind === 'income'), (o) => o.amount))}</dd><dt>المصروفات</dt><dd>${money(E.sum(monthOcc.filter((o) => o.kind === 'expense'), (o) => o.amount))}</dd><dt>عدد الاستحقاقات</dt><dd>${nf(monthOcc.length, 0)}</dd></div><p class="xs muted" style="margin-top:8px">التقويم شهر ميلادي، بينما الخطة تتبع دورة الراتب (من يوم ${nf(state.settings.cycleStartDay, 0)}).</p></section>
  </div>`;
}

/* ───────── التوقع ───────── */
function viewForecast() {
  const pro = proActive();
