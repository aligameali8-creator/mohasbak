  return `${topbar('التوقع المالي')}
  <div class="row spread"><div class="seg" role="group" aria-label="المدة">${[12, 24].map((x) => `<button data-act="horizon" data-h="${x}" aria-pressed="${h === x}">${pro ? '' : icon('lock')}${nf(x, 0)} شهراً</button>`).join('')}</div><div class="row">${['comfortable', 'balanced', 'pressing', 'risk'].map((l) => `<span class="pill lvl-${l}">${E.LEVELS[l]}: ${nf(counts[l] || 0, 0)}</span>`).join('')}</div></div>
  <div class="notice">${icon('wallet')}<div><strong>التوقع يبدأ من رصيدك: ${money(state.balance.amount)}</strong><p class="small muted">آخر تحديث ${dlabel(state.balance.asOf)}. حدّثه من وقت لآخر ليبقى التوقع دقيقاً.</p><button class="btn sm" data-act="balance" style="margin-top:6px">${icon('wallet')} تحديث الرصيد</button></div></div>
  <section class="card"><div class="card-h"><h2>خريطة ${h > 12 ? 'السنتين' : 'السنة'}: كم يتبقى من كل راتب</h2><button class="btn sm primary" data-act="whatif">${icon('spark')} ماذا لو؟</button></div>
    <div class="ymap">${fc.rows.map((r, i) => { const y = r.start.slice(0, 4), newYear = i === 0 || fc.rows[i - 1].start.slice(0, 4) !== y; return `<button class="ytile lvl-${r.level}" data-act="open-cycle" data-key="${r.key}" aria-label="${esc(cycleTitle(r.key))}: يتبقى ${nf(r.net, 0)}، ${r.levelName}">${newYear ? `<em>${y}</em>` : ''}<small>${shortMonth(r.start.slice(0, 7))}</small><b class="amt">${kfmt(r.net)}</b><i></i></button>`; }).join('')}${pro ? '' : proLockedTiles(fc.rows[fc.rows.length - 1].key, 12 - fc.rows.length)}</div>${pro ? '' : `<button class="btn primary block" data-act="paywall" data-f="forecast" style="margin-top:10px">${icon('spark')} افتح توقع السنة كاملة مع Pro</button>`}
    <div class="legend"><span><i style="background:var(--good)"></i>مريح</span><span><i style="background:var(--calm)"></i>متوازن</span><span><i style="background:var(--warn)"></i>ضاغط</span><span><i style="background:var(--risk)"></i>خطر</span><span>الرقم = يتبقى بعد كل الخصميات</span></div>
  </section>
  <section class="card"><div class="card-h"><h2>الرصيد القابل للصرف المتوقع</h2><span class="xs muted">بعد المصروفات والادخار المستهدف</span></div>${balanceChart(fc.rows, Number(state.settings.reserveMin) || 0)}</section>
  <div class="grid g2">
    <section class="card stack"><div class="card-h"><h2>ما يجب أن تعرفه</h2></div>
      ${ins.nextMonthHold ? `<div class="insight lvl-${fc.rows[1].level}"><strong>احجز ${money(ins.nextMonthHold.hold)} الآن لدورة ${ins.nextMonthHold.name}</strong><span class="small muted">تحتاج دورة ${ins.nextMonthHold.name} إلى ${moneyText(ins.nextMonthHold.need)} إضافية${ins.nextMonthHold.shortBy > 0 ? `، ويبقى ${moneyText(ins.nextMonthHold.shortBy)} تغطيه البنود المرنة أدناه` : ''}.</span></div>` : ''}
      ${ins.preSave.map((p) => `<div class="insight lvl-pressing"><strong>ادخر لدورة ${p.name} مسبقاً</strong><span class="small muted">تحتاج ${moneyText(p.need)} إضافية. اقتراح: ${moneyText(Math.ceil(p.perMonth))} من كل دورة من ${nf(p.fromMonths.length, 0)} دورات قبلها${p.covered ? '' : ' (لا يكفي الفائض لتغطيتها بالكامل)'}.</span></div>`).join('')}
      ${ins.endingInstallments.map((e) => `<div class="insight lvl-comfortable"><strong>من ${e.freedName}: يتحرر ${money(e.monthly)} شهرياً</strong><span class="small muted">آخر دفعة من قسط ${esc(e.name)} (${esc(e.provider)}) في دورة ${E.cycleName(e.lastKey)}. المتبقي ${moneyText(e.remaining)}.</span></div>`).join('')}
      ${ins.bestMonth ? `<div class="insight"><strong>أفضل شهر للشراء أو زيادة الادخار: ${ins.bestMonth.name}</strong><span class="small muted">${esc(ins.bestMonth.reason)}</span></div>` : ''}
      ${ins.cuts.length ? `<div class="insight lvl-pressing"><strong>بنود مرنة قابلة للتخفيض في ${fc.rows[1].name}</strong><span class="small muted">${ins.cuts.map((c) => `${esc(c.name)}: ${c.how} يوفر ${moneyText(c.saving)}`).join(' · ')}</span></div>` : ''}
    </section>
    <section class="card"><div class="card-h"><h2>الدخل مقابل المصروفات</h2></div>${cashflowChart(fc.rows.slice(0, Math.min(12, fc.rows.length)))}</section>
  </div>
  <section class="fc-list" aria-label="الدورات">
    ${fc.rows.map((r) => `<button class="fc lvl-${r.level}" data-act="open-cycle" data-key="${r.key}"><span class="fc-stripe"></span>
      <span style="min-width:0;display:grid;gap:4px"><span class="row"><strong>${r.name}</strong>${levelPill(r.level, r.levelName)}</span>
      <span class="fc-meta"><span>دخل <b>${nf(r.income)}</b></span><span>مصروف <b>${nf(r.expenses)}</b></span><span>أقساط <b>${nf(r.installments)}</b></span><span>التزامات <b>${r.income ? Math.round(r.ratio * 100) : 0}%</b></span><span>ادخار <b>${nf(r.saving)}</b></span></span>
      <span class="xs muted">${esc(r.reasons[0] || '')}</span></span>
      <span style="text-align:end;display:grid;gap:2px"><span class="xs muted">الفائض</span>${signed(r.disposable)}<span class="xs muted">الرصيد ${nf(r.endSpendable)}</span></span></button>`).join('')}
  </section>`;
}

/* ───────── الأهداف والادخار ───────── */
function viewGoals() {
  const fc = fcRows(12), cur = fc.rows[0];
  const goals = state.goals.filter((g) => !g.deletedAt);
  const target = E.savingTarget(state);
  return `${topbar('الأهداف والادخار')}
  <section class="tiles">
    <div class="tile"><span class="k">الادخار الشهري المستهدف</span><span class="v">${nf(target)}</span><span class="s">عام ${nf(state.settings.savingMonthly)} + أهداف</span></div>
    <div class="tile"><span class="k">رصيد الادخار الحالي</span><span class="v">${nf(E.r2((Number(state.settings.savingsBalance) || 0) + E.sum(goals, (g) => g.saved || 0)))}</span><span class="s">حساب الادخار + الأهداف</span></div>
    <div class="tile"><span class="k">المتوقع بعد 12 شهراً</span><span class="v">${nf(fc.rows[fc.rows.length - 1].savedTotal)}</span><span class="s">إذا التزمت بالخطة</span></div>
    <div class="tile"><span class="k">الحد الأدنى للاحتياطي</span><span class="v">${nf(state.settings.reserveMin)}</span><span class="s">لا يُصرف</span></div>
  </section>
  <section class="card"><div class="card-h"><h2>الأهداف</h2><button class="btn sm primary" data-act="goal">${icon('plus')} هدف جديد</button></div>
    <div class="list">${goals.length ? goals.map((g) => { const pct = Math.min(100, Math.round(((g.saved || 0) / (g.target || 1)) * 100)); const rem = Math.max(0, g.target - (g.saved || 0)); const months = g.monthly > 0 ? Math.ceil(rem / g.monthly) : null; const eta = months != null ? E.cycleName(E.keyAdd(cur.key, months)) : null; const onTrack = g.targetDate && eta ? E.keyDiff(E.keyAdd(cur.key, months), g.targetDate.slice(0, 7)) >= 0 : null;
      return `<div class="li" style="--cc:var(--good)"><div class="li-ic">${icon('target')}</div><div class="li-main"><div class="li-t">${esc(g.name)}</div><div class="progress" style="margin-block:6px"><i style="width:${pct}%"></i></div><div class="li-s"><span>${pct}% · ${moneyText(g.saved || 0)} من ${moneyText(g.target)}</span>${g.monthly ? `<span>· ${moneyText(g.monthly)} شهرياً</span>` : ''}${eta ? `<span>· الاكتمال المتوقع ${eta}</span>` : '<span>· حدد مبلغاً شهرياً لمعرفة موعد الاكتمال</span>'}${onTrack === false ? '<span class="chip" style="color:var(--warn)">متأخر عن الموعد</span>' : ''}</div></div>
      <div class="li-end"><div class="li-actions"><button class="btn sm" data-act="goal-add" data-id="${g.id}">إيداع</button><button class="btn sm ghost" data-act="goal" data-id="${g.id}" aria-label="تعديل ${esc(g.name)}">${icon('edit')}</button></div></div></div>`; }).join('')
      : emptyBlock('target', 'لا أهداف بعد', 'أضف هدفاً مثل صندوق الطوارئ أو السفر، وسيُضاف مبلغه الشهري إلى خطة الادخار.', `<button class="btn primary" data-act="goal">${icon('plus')} أضف هدفاً</button>`)}</div>
  </section>
  <section class="card"><div class="card-h"><h2>سجل تحويل الادخار</h2><button class="btn sm" data-nav="options">تعديل المبلغ العام</button></div>
    <div class="table-wrap"><table class="t"><thead><tr><th>الدورة</th><th class="n">المستهدف</th><th class="n">الممكن</th><th>الحالة</th></tr></thead><tbody>
    ${fc.rows.slice(0, 6).map((r) => { const sl = state.savingsLedger[r.key]; return `<tr><td>${r.name}</td><td class="n">${nf(target)}</td><td class="n">${nf(r.possibleSaving)}</td><td><label class="check" style="min-height:32px"><input type="checkbox" data-act="saving-done" data-key="${r.key}" ${sl && sl.done ? 'checked' : ''}> ${sl && sl.done ? 'تم ' + moneyText(sl.amount) : 'لم يُحوَّل'}</label></td></tr>`; }).join('')}
    </tbody></table></div></section>`;
}

/* ───────── التقارير ───────── */
function viewReports() {
  const tab = ui.reportTab;
  const tabs = [['month', 'شهري'], ['year', 'سنوي'], ['pva', 'المخطط مقابل الفعلي'], ['search', 'بحث وفلاتر']];
  let body = '';
  const cur = E.cycleOf(today(), state.settings);
  if (tab === 'month') {
    const key = ui.reportCycle || cur; const s = E.summarizeCycle(state, key);
    body = `<div class="row spread">${cycleNav(key, 'rcyc')}<button class="btn sm" data-act="export-menu" data-key="${key}">${icon('download')} تصدير</button></div>
    <section class="tiles"><div class="tile"><span class="k">الدخل</span><span class="v">${nf(s.income)}</span></div><div class="tile"><span class="k">المصروفات</span><span class="v">${nf(s.expensesTotal)}</span></div><div class="tile"><span class="k">الصافي</span><span class="v ${s.net < 0 ? 'neg' : ''}">${nf(s.net)}</span></div><div class="tile"><span class="k">نسبة الالتزامات</span><span class="v">${s.income ? Math.round(s.ratio * 100) : 0}%</span></div></section>
    <div class="grid g2"><section class="card"><div class="card-h"><h2>حسب الفئة</h2></div>${categoryBars(s.byCat, s.expensesTotal)}</section>
    <section class="card"><div class="card-h"><h2>حسب النوع</h2></div><div class="table-wrap"><table class="t" style="min-width:0"><tbody>${Object.entries(s.byType).filter(([, v]) => v).map(([k, v]) => `<tr><td>${E.EXPENSE_TYPES[k]}</td><td class="n">${nf(v)}</td><td class="n muted">${s.expensesTotal ? Math.round((v / s.expensesTotal) * 100) : 0}%</td></tr>`).join('')}</tbody><tfoot><tr><td>الإجمالي</td><td class="n">${nf(s.expensesTotal)}</td><td></td></tr></tfoot></table></div></section></div>`;
  } else if (tab === 'year') {
    const year = ui.reportYear || Number(cur.slice(0, 4));
    const keys = Array.from({ length: 12 }, (_, i) => `${year}-${String(i + 1).padStart(2, '0')}`);
    const off = E.keyDiff(cur, keys[0]);
    const fc = off >= 0 ? fcRows(Math.min(24, off + 12)).rows : null;
    const rows = keys.map((k) => { const r = fc && fc.find((x) => x.key === k); const s = r ? r.summary : E.summarizeCycle(state, k); return { k, s, r }; });
    const tot = (f) => E.sum(rows, f);
    body = `<div class="row spread"><div class="cycle-nav"><button class="icon-btn" data-act="ryear" data-step="-1" aria-label="السنة السابقة">${icon('chevR')}</button><h2>${year}</h2><button class="icon-btn" data-act="ryear" data-step="1" aria-label="السنة التالية">${icon('chevL')}</button></div><button class="btn sm" data-act="export-xlsx">${icon('download')} Excel</button></div>
    <section class="card"><div class="table-wrap"><table class="t"><thead><tr><th>الدورة</th><th class="n">الدخل</th><th class="n">المصروفات</th><th class="n">الأقساط</th><th class="n">الصافي</th><th class="n">نسبة الالتزام</th><th>الحالة</th></tr></thead><tbody>
    ${rows.map(({ k, s, r }) => `<tr><td><button class="btn sm ghost" data-act="open-cycle" data-key="${k}">${shortMonth(k)}</button></td><td class="n">${nf(s.income)}</td><td class="n">${nf(s.expensesTotal)}</td><td class="n">${nf(s.installments)}</td><td class="n ${s.net < 0 ? 'neg' : ''}">${nf(s.net)}</td><td class="n">${s.income ? Math.round(s.ratio * 100) : 0}%</td><td>${r ? levelPill(r.level, r.levelName) : E.keyDiff(k, cur) > 0 ? '<span class="chip">سابقة</span>' : '<span class="chip">خارج المدى</span>'}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>الإجمالي</td><td class="n">${nf(tot((x) => x.s.income))}</td><td class="n">${nf(tot((x) => x.s.expensesTotal))}</td><td class="n">${nf(tot((x) => x.s.installments))}</td><td class="n">${nf(tot((x) => x.s.net))}</td><td></td><td></td></tr></tfoot></table></div></section>`;
  } else if (tab === 'pva') {
    const key = ui.reportCycle || cur; const rows = E.planVsActual(state, key);
    const T = (f) => E.sum(rows, f);
    body = `<div class="row spread">${cycleNav(key, 'rcyc')}</div>
    <section class="card"><p class="small muted" style="margin-bottom:8px">الفعلي يُحسب مما سجّلته «مدفوعاً». البنود غير المسجلة تُعامل بقيمتها المخططة في عمود «لم يُسجَّل».</p><div class="table-wrap"><table class="t"><thead><tr><th>الفئة</th><th class="n">المخطط</th><th class="n">الفعلي</th><th class="n">لم يُسجَّل</th><th class="n">الفرق</th></tr></thead><tbody>
    ${rows.sort((a, b) => b.planned - a.planned).map((r) => `<tr><td>${esc(catOf(r.categoryId).name)}</td><td class="n">${nf(r.planned)}</td><td class="n">${nf(r.actual)}</td><td class="n muted">${nf(r.unrecorded)}</td><td class="n ${r.diff > 0 ? 'neg' : r.diff < 0 ? 'pos' : ''}">${r.diff > 0 ? '+' : ''}${nf(r.diff)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">لا بيانات</td></tr>'}
    </tbody><tfoot><tr><td>الإجمالي</td><td class="n">${nf(T((r) => r.planned))}</td><td class="n">${nf(T((r) => r.actual))}</td><td class="n">${nf(T((r) => r.unrecorded))}</td><td class="n">${nf(T((r) => r.diff))}</td></tr></tfoot></table></div></section>`;
  } else {
    const f = Object.assign({ q: '', cat: '', acc: '', type: '', status: '', from: E.cycleRange(cur, state.settings).start, to: E.addDays(E.cycleRange(E.keyAdd(cur, 2), state.settings).end, -1) }, ui.filters);
    let list = E.upcoming(state, f.from, E.diffDays(f.from, f.to) + 1);
    if (f.q) list = list.filter((o) => (o.item.name + ' ' + (o.item.note || '') + ' ' + (o.item.plan ? o.item.plan.provider : '')).includes(f.q));
    if (f.cat) list = list.filter((o) => o.item.categoryId === f.cat);
    if (f.acc) list = list.filter((o) => o.item.accountId === f.acc);
    if (f.type) list = list.filter((o) => (f.type === 'income' ? o.kind === 'income' : o.item.type === f.type));
    if (f.status) list = list.filter((o) => o.status === f.status);
    const sel = (name, opts, v) => `<select name="${name}" class="in">${opts.map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
    body = `<section class="card"><form class="form" data-form="filters"><div class="f"><label for="fq">بحث بالاسم أو الملاحظة</label><input id="fq" class="in" name="q" value="${esc(f.q)}" placeholder="مثال: كهرباء"></div>
      <div class="f2"><div class="f"><label>الفئة</label>${sel('cat', [['', 'كل الفئات']].concat(state.categories.map((c) => [c.id, c.name])), f.cat)}</div><div class="f"><label>الحساب</label>${sel('acc', [['', 'كل الحسابات']].concat(state.accounts.map((a) => [a.id, a.name])), f.acc)}</div>
      <div class="f"><label>النوع</label>${sel('type', [['', 'الكل'], ['income', 'دخل']].concat(Object.entries(E.EXPENSE_TYPES)), f.type)}</div><div class="f"><label>الحالة</label>${sel('status', [['', 'الكل'], ['due', 'مستحق'], ['paid', 'مدفوع'], ['skipped', 'متخطى']], f.status)}</div>
      <div class="f"><label for="ffrom">من</label><input id="ffrom" type="date" class="in" name="from" value="${f.from}"></div><div class="f"><label for="fto">إلى</label><input id="fto" type="date" class="in" name="to" value="${f.to}"></div></div>
      <div class="row"><button class="btn primary" type="submit">${icon('search')} تطبيق</button><button class="btn ghost" type="button" data-act="filters-reset">مسح الفلاتر</button></div></form></section>
    <section class="card"><div class="card-h"><h2>${nf(list.length, 0)} نتيجة</h2><span class="small">مصروفات ${money(E.sum(list.filter((o) => o.kind === 'expense'), (o) => o.amount))} · دخل ${money(E.sum(list.filter((o) => o.kind === 'income'), (o) => o.amount))}</span></div><div class="list">${list.slice(0, 200).map((o) => occRow(o, { account: true })).join('') || emptyBlock('search', 'لا نتائج', 'جرّب توسيع الفترة أو مسح الفلاتر.')}</div></section>`;
  }
  return `${topbar('التقارير')}<div class="seg" role="group" aria-label="نوع التقرير">${tabs.map(([k, t]) => `<button data-act="rtab" data-tab="${k}" aria-pressed="${tab === k}">${t}</button>`).join('')}</div>${body}`;
}

  <section class="card">${list.length ? list.map((n) => `<div class="notif lvl-${n.level} ${n.read ? 'read' : ''}"><span class="bar"></span><div><strong>${esc(n.title)}</strong><p class="small muted">${esc(n.body)}</p></div>

/* ───────── المزيد / كل البنود / السجل ───────── */
function viewMore() {
  const links = [['whatif', 'ماذا لو؟', 'spark', 'جرّب أثر أي قرار مالي قبل ما تتخذه'], ['calendar', 'تقويم الالتزامات', 'calendar', 'كل الاستحقاقات يوماً بيوم'], ['goals', 'الأهداف والادخار', 'target', 'تقدم أهدافك وخطة الادخار'], ['reports', 'التقارير', 'report', 'شهري، سنوي، المخطط مقابل الفعلي، بحث'], ['items', 'كل البنود', 'list', 'تعديل وإيقاف وحذف الدخل والمصروفات'], ['alerts', 'التنبيهات', 'bell', 'مستحقات قريبة وأشهر ضاغطة'], ['options', 'الإعدادات والنسخ الاحتياطي', 'gear', 'الدورة، القفل، المزامنة، التصدير'], ['audit', 'سجل التدقيق', 'history', 'كل تعديل مع وقته']];
  return `${topbar('المزيد')}<div class="more-grid">${links.map(([v, t, i, d]) => `<button class="more-link" ${v === 'whatif' ? 'data-act="whatif"' : `data-nav="${v}"`}>${icon(i)}<span><strong>${t}</strong><span class="xs muted" style="display:block">${d}</span></span></button>`).join('')}</div>`;
}
function viewItems() {
  const f = ui.itemsFilter;
  const filters = [['all', 'الالتزامات'], ['income', 'الدخل'], ['expense', 'المصروفات'], ['installment', 'الأقساط'], ['subscription', 'الاشتراكات'], ['daily', 'اليومية'], ['paused', 'موقوفة'], ['deleted', 'محذوفة']];
  let list = state.items.slice();

function syncFormVisibility(form) {

function readItemForm(form) {
  const d = fdata(form); const errs = [];
  const amount = num(d.amount);
  if (isNaN(amount) || amount < 0) errs.push('أدخل مبلغاً صحيحاً (0 أو أكثر).');
  if (!d.name || !d.name.trim()) errs.push('أدخل اسماً للبند.');
  const freq = d.freq;
  const rule = { freq, interval: Number(d.interval) || 1, day: Math.min(31, Math.max(1, Number(d.day) || E.parse(d.start || today()).d)), start: d.start };
  if (!d.start) errs.push('اختر التاريخ.');
  if (freq === 'once') { rule.date = d.start; delete rule.interval; delete rule.day; }
  if (freq === 'yearly') rule.month = Number(d.month);
  if (freq === 'months') rule.months = [].concat(d.months || []).map(Number);
  if (freq === 'months' && !rule.months.length) errs.push('اختر شهراً واحداً على الأقل للدخل/المصروف الموسمي.');
  if (freq === 'weekly') delete rule.day;
  if (freq !== 'once') { if (d.end) rule.end = d.end; if (d.count) rule.count = Number(d.count); }
  if (rule.end && rule.end < rule.start) errs.push('تاريخ النهاية قبل تاريخ البداية.');
  return { d, errs, amount, rule };
}
function submitItemForm(form) {
  const kind = form.dataset.kind; const id = form.dataset.id;
  const { d, errs, amount, rule } = readItemForm(form);
  if (errs.length) return showErrors(form, errs);
  const meta = { name: d.name.trim(), categoryId: d.categoryId, accountId: d.accountId, note: (d.note || '').trim() };
  if (kind === 'expense') Object.assign(meta, { type: d.type, priority: d.priority });
  else Object.assign(meta, { type: d.isPrimary ? 'salary' : 'other', isPrimary: !!d.isPrimary, estimate: !!d.estimate, shiftWeekend: !!d.shiftWeekend });
  if (!id) {
    const it = Seed.mk(Object.assign({ kind, amount, rule, createdAt: nowISO() }, meta));
    it.versions = [{ from: rule.start, amount }];
    if (d.paidNow && rule.freq === 'once') it.ledger[rule.start] = { status: 'paid', amount, on: today(), at: nowISO() };
    const e = E.validateItem(it); if (e.length) return showErrors(form, e);
    closeSheet();
    commit(`أُضيف ${kind === 'income' ? 'دخل' : 'مصروف'} «${it.name}» (${moneyText(amount)})`, (st) => { st.items.push(it); st.recent = [it.categoryId].concat((st.recent || []).filter((x) => x !== it.categoryId)).slice(0, 4); }, { action: 'create', entity: 'item', id: it.id });
    return;
  }
  const it = state.items.find((x) => x.id === id);
  const eff = d.effective || today();
  const ruleKeys = ['freq', 'interval', 'month', 'start', 'end', 'count', 'months', 'date'];
  const old = it.rule || {};
  const ruleChanged = ruleKeys.some((k) => JSON.stringify(old[k] ?? null) !== JSON.stringify(rule[k] ?? null));
  const hasPast = E.occurrences(it, '1900-01-01', eff).length > 0;
  const changes = [];
  closeSheet();
  commit(`عُدّل «${meta.name}»`, (st) => {
    const x = st.items.find((y) => y.id === id);
    Object.keys(meta).forEach((k) => { if (x[k] !== meta[k]) changes.push(k); x[k] = meta[k]; });
    if (ruleChanged && hasPast) {
      // تقسيم: ينتهي البند القديم قبل تاريخ السريان ويبدأ بند جديد بالقاعدة الجديدة — لتبقى الأشهر السابقة صحيحة
      x.rule = Object.assign({}, old, { end: E.addDays(eff, -1) });
      const nr = Object.assign({}, rule); if (nr.start < eff) nr.start = eff; if (nr.freq === 'once') nr.date = nr.start;
      const n = Seed.mk(Object.assign({ kind: x.kind, amount, rule: nr, prevId: x.id, createdAt: nowISO() }, meta));
      n.versions = [{ from: nr.start, amount, day: rule.day }];
      st.items.push(n);
      st.audit.unshift({ at: nowISO(), action: 'split', summary: `تغيير نمط «${meta.name}» من ${eff}: أُنهي البند القديم وأُنشئ بند جديد`, entity: 'item', id: n.id });
    } else {
      if (ruleChanged) x.rule = rule;
      const cv = E.versionAt(x, eff);
      const dayChanged = rule.day && rule.day !== (cv.day || old.day);
      if (Number(cv.amount) !== amount || (dayChanged && hasPast)) E.setVersion(x, hasPast ? eff : (x.versions[0] ? x.versions[0].from : rule.start), dayChanged && hasPast ? { amount, day: rule.day } : { amount });
      if (!hasPast) { x.versions = [{ from: rule.start || rule.date, amount }]; x.rule = rule; }
    }
    x.updatedAt = nowISO();
  }, { action: 'update', entity: 'item', id });
}

})();
window.__pro = { status: proStatus, PRO, setEnt: proSetEnt, applyOwned };

/* الإقلاع: بعد تحميل كل الوحدات (ومنها Pro) وقبل الجسر الأصلي */
'use strict';
boot();

/* محاسبك المالي — الجسر الأصلي (أندرويد عبر Capacitor)
 * يعمل فقط داخل التطبيق الأصلي؛ في المتصفح لا يفعل شيئاً.
 * الإشعارات المجدولة، الودجت، قفل البصمة، زر الرجوع، حفظ ومشاركة الملفات. */
'use strict';
const Native = (() => {
  const C = window.Capacitor;
  const on = !!(C && typeof C.isNativePlatform === 'function' && C.isNativePlatform());
  const P = on ? C.Plugins : {};
  return { on, P, platform: on ? C.getPlatform() : 'web' };
})();
window.__native = Native;

if (Native.on) {
  const { LocalNotifications: LN, App, MohasbakNative: MN, Filesystem: FS, Share } = Native.P;
  const atLocal = (date, h, m) => { const [y, mo, d] = date.split('-').map(Number); return new Date(y, mo - 1, d, h, m || 0, 0); };
  const shortMoney = (x) => `${nf(Math.round(x), 0)} ${curSym()}`;

  /* ── الإشعارات: نعيد جدولة 30 يوماً قادمة بعد كل تعديل ── */
  let notifTimer = null, notifAsked = false;
  async function ensureNotifPermission() {
    if (!LN) return false;
    try {
      let p = await LN.checkPermissions();
      if (p.display !== 'granted' && !notifAsked) { notifAsked = true; p = await LN.requestPermissions(); }
      return p.display === 'granted';
    } catch (e) { return false; }
  }
  function buildNotifications() {
    const s = state.settings, t = today(), now = new Date(), list = [];
    const [remindH, remindM] = remindTime().split(':').map(Number);
    const push = (at, title, body, extra) => { if (at > now) list.push(Object.assign({ id: list.length + 1, title, body, schedule: { at, allowWhileIdle: true }, smallIcon: 'ic_stat_mohasbak', iconColor: '#3B43A6' }, extra || {})); };
    // 1) الخصميات القادمة: مساء اليوم السابق
    for (const o of E.upcoming(state, t, 31)) {
      if (o.status !== 'due' || o.item.type === 'daily') continue;
      if (o.kind === 'expense') push(atLocal(E.addDays(o.date, -1), 20, 0), `بكرة يُخصم: ${o.item.name}`, `${shortMoney(o.amount)}${o.item.type === 'installment' && o.n ? ` · القسط ${o.n} من ${o.of}` : ''}`);
      else if (o.item.isPrimary) push(atLocal(o.date, 9, 0), 'اليوم يوم الراتب', `نزل ${shortMoney(o.amount)}؟ خطة الشهر جاهزة: افتح لترى كم يتبقى لك.`);
    }
    // 2) تذكير يومي بتسجيل المصاريف + مسموح اليوم
    if (s.dailyReminder !== false) {
      const db = E.dailyBudget(state, t);
      for (let i = 0; i < 14; i++) {
        const d = E.addDays(t, i);
        if (i === 0 && s.logConfirmed === t) continue; // أكّد أنه سجّل كل شيء اليوم
        push(atLocal(d, remindH, remindM), 'هل سجلت مصروفاتك كلها لهذا اليوم؟', i === 0 && db.income > 0 ? `مسموح اليوم ${shortMoney(Math.max(0, db.todayLeft))}. التسجيل يأخذ ثانيتين.` : 'التسجيل يأخذ ثانيتين ويبقي «مسموح اليوم» دقيقاً.');
      }
    }
    // 2ب) صرفك أسرع من راتبك / عجز / التزام لن يُغطّى: إشعار ظهراً أو مساءً اليوم
    try {
      const pm = E.paceMessages(state, t).filter((m) => m.level === 'risk')[0];
      if (pm) { const noon = atLocal(t, 13, 0), eve = atLocal(t, 19, 30); push(now < noon ? noon : eve, pm.title, pm.body); }
    } catch (e) { /* */ }
    // 3) الراتب القادم ضاغط: قبل بدايته بثلاثة أيام
    try {
      const fc = E.forecast(state, { today: t, months: 4 });
      fc.rows.slice(1).forEach((r) => { if (r.level === 'pressing' || r.level === 'risk') push(atLocal(E.addDays(r.start, -3), 19, 0), `${cycleTitle(r.key)} ${r.levelName}`, (r.reasons[0] || '') + ' افتح لترى الحل المقترح.'); });
    } catch (e) { /* */ }
    return list.slice(0, 60);
  }
  async function syncNotifications() {
    if (!LN || !state || !state.settings.onboarded || state.settings.nativeNotify === false) return;
    if (!(await ensureNotifPermission())) return;
    try {
      const pend = await LN.getPending();
      if (pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map((n) => ({ id: n.id })) });
      const list = buildNotifications();
      if (list.length) await LN.schedule({ notifications: list });
      Native.lastScheduled = list.length;
    } catch (e) { console.warn('notif', e); }
  }

  /* ── الودجت على الشاشة الرئيسية ── */
  async function syncWidget() {
    if (!MN || !state || !state.settings.onboarded) return;
    try {
      const t = today(), db = E.dailyBudget(state, t), d = stmtData(E.cycleOf(t, state.settings));
      const over = db.todayLeft < 0;
      await MN.updateWidget({
        title: over ? 'تجاوزت مسموح اليوم بـ' : 'مسموح تصرف اليوم',
        big: shortMoney(Math.abs(db.todayLeft)),
        line1: `يتبقى من الراتب ${shortMoney(d.left)}`,
        line2: `الراتب القادم بعد ${nf(db.daysLeft, 0)} ${db.daysLeft === 1 ? 'يوم' : db.daysLeft <= 10 ? 'أيام' : 'يوماً'}`
      });
    } catch (e) { console.warn('widget', e); }
  }

  window.__nativeSync = () => { clearTimeout(notifTimer); notifTimer = setTimeout(() => { syncWidget(); syncNotifications(); }, 600); };

  /* ── إجراء من الودجت (زر +) ── */
  async function consumeAction() {
    if (!MN) return;
    try { const r = await MN.consumeAction(); if (r && r.action === 'quick' && state && state.settings.onboarded && !ui.locked && !ui.bioLocked) { go('home'); quickSpend(); } } catch (e) { /* */ }
  }

  /* ── قفل البصمة ── */
  let hiddenAt = 0;
  async function bioUnlock() {
    try { await MN.authenticate({ title: 'محاسبك المالي', subtitle: 'افتح بالبصمة أو رمز الجوال' }); ui.bioLocked = false; render(); consumeAction(); }
    catch (e) { ui.bioMsg = 'لم يتم التحقق. حاول مرة أخرى.'; render(); }
  }
  window.__bioUnlock = bioUnlock;
  function needBio() { return state && state.settings.bioLock && !state.security.pinEnabled; }

  /* ── زر الرجوع في أندرويد ── */
  let exitAt = 0;
  if (App) {
    App.addListener('backButton', () => {
      if (ui.locked || ui.bioLocked || !state) return App.exitApp();
      if ($('.sheet')) return closeSheet();
      if (ui.view !== 'home') return go('home');
      if (Date.now() - exitAt < 2500) return App.exitApp();
      exitAt = Date.now(); toast('اضغط رجوع مرة أخرى للخروج');
    });
    App.addListener('appStateChange', ({ isActive }) => {
      if (!isActive) { hiddenAt = Date.now(); if (state) save(true); return; }
      if (needBio() && hiddenAt && Date.now() - hiddenAt > (Number(state.settings.lockMinutes) || 5) * 60000) { ui.bioLocked = true; render(); bioUnlock(); return; }
      if (state) { render(); window.__nativeSync(); }
      consumeAction(); checkNativeUpdate();
    });
  }

  /* ── حفظ ومشاركة الملفات (التنزيل العادي لا يعمل داخل التطبيق) ── */
  window.__nativeSaveFile = async (filename, data) => {
    const toB64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
    const isText = typeof data === 'string';
    const w = await FS.writeFile({ path: filename, data: isText ? data : await toB64(data instanceof Blob ? data : new Blob([data])), directory: 'CACHE', encoding: isText ? 'utf8' : undefined });
    await Share.share({ title: filename, url: w.uri, dialogTitle: 'حفظ أو مشاركة الملف' });
    toast('اختر أين تحفظ الملف أو تشاركه');
  };

  /* ── اختبار الإشعار من الإعدادات ── */
  window.__nativeTestNotif = async () => {
    if (!(await ensureNotifPermission())) return toast('فعّل الإشعارات للتطبيق من إعدادات الجوال');
    await LN.schedule({ notifications: [{ id: 999, title: 'محاسبك المالي', body: 'هكذا ستصلك التنبيهات قبل كل خصم.', schedule: { at: new Date(Date.now() + 5000), allowWhileIdle: true }, smallIcon: 'ic_stat_mohasbak', iconColor: '#3B43A6' }] });
    toast('سيصلك إشعار تجريبي خلال 5 ثوانٍ');
  };
  window.__nativeCanBio = async () => { try { return (await MN.canBiometric()).available; } catch (e) { return false; } };

  // تشغيل أول مرة
  if (needBio()) { ui.bioLocked = true; render(); bioUnlock(); }
  /* ── تحديث تطبيق أندرويد (نسخة الاختبار قبل Google Play): نقارن رقم الإصدار بالموقع ونعرض زر التنزيل ── */
  async function checkNativeUpdate() {
    if (!window.__BUILD__) return;
    try {
      const r = await fetch('https://aligameali8-creator.github.io/mohasbak/version.json?t=' + Date.now(), { cache: 'no-store' });
      const v = r.ok ? (await r.json()).v : null;
      const nu = v && v !== window.__BUILD__ ? v : null;
      if (nu !== (ui.nativeUpdate || null)) { ui.nativeUpdate = nu; if (state) render(); }
    } catch (e) { /* بدون اتصال */ }
  }
  window.__nativeCheckUpdate = checkNativeUpdate;
  window.__APK_URL = 'https://github.com/aligameali8-creator/mohasbak/releases/download/android-latest/mohasbak.apk';
  setTimeout(checkNativeUpdate, 2500);
  setTimeout(() => { if (state) window.__nativeSync(); consumeAction(); }, 800);
}

</script></body></html>
